<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Battery Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:sans-serif;background:#f0f2f5;padding:20px}
.container{max-width:900px;margin:auto}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:15px}
h2{margin-bottom:10px}

input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:6px;
  border:1px solid #ccc
}

.row{display:flex;gap:10px}
.row > *{flex:1}

button{
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.refresh{background:#3498db;color:white}
.export{background:#2ecc71;color:white}

.table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px
}

.table th,.table td{
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:left;
}

.badge-in{color:green;font-weight:bold}
.badge-out{color:#e67e22;font-weight:bold}

.loading{text-align:center;padding:20px}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>🔋 Battery Dashboard</h2>

<div class="row">
<input id="search" placeholder="Search Battery ID">
<select id="filter">
  <option value="">All</option>
  <option value="IN">IN Shop</option>
  <option value="OUT">OUT</option>
</select>
</div>

<div class="row">
<button class="refresh" onclick="loadData()">Refresh</button>
<button class="export" onclick="exportCSV()">Export CSV</button>
</div>

</div>

<div class="card">
<div id="tableContainer"></div>
</div>

</div>

<script>
const db = supabase.createClient(
  "https://bdcwfgutqnfhacanswlk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkY3dmZ3V0cW5maGFjYW5zd2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTg0NzMsImV4cCI6MjA5MDI3NDQ3M30.qHTe6H5ca5PQ9RahiIdrGc4eOMMJrZrSsACAl5mJm4A"
);

let currentData = [];

// ===== LOAD DATA =====
async function loadData(){
  const container = document.getElementById("tableContainer");
  container.innerHTML = '<div class="loading">Loading...</div>';

  try{
    const {data,error} = await db
      .from("battery_swaps")
      .select("*")
      .order("id",{ascending:false})
      .limit(200);

    if(error) throw error;

    currentData = data;
    renderTable();

  }catch(err){
    container.innerHTML = "<div style='color:red'>Error loading data</div>";
  }
}

// ===== RENDER =====
function renderTable(){

  const search = document.getElementById("search").value.toUpperCase();
  const filter = document.getElementById("filter").value;

  let filtered = currentData.filter(row => {

    const code = extractCode(row.battery_id);

    if(search && !code.includes(search)) return false;

    if(filter === "IN" && row.time_out !== null) return false;
    if(filter === "OUT" && row.time_out === null) return false;

    return true;
  });

  let html = `
  <table class="table">
    <thead>
      <tr>
        <th>Battery</th>
        <th>Vehicle IN</th>
        <th>Vehicle OUT</th>
        <th>Status</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody>
  `;

  filtered.forEach(r => {

    const code = extractCode(r.battery_id);

    const status = r.time_out === null
      ? `<span class="badge-in">IN</span>`
      : `<span class="badge-out">OUT</span>`;

    html += `
      <tr>
        <td>${code}</td>
        <td>${r.vehicle_in || "-"}</td>
        <td>${r.vehicle_out || "-"}</td>
        <td>${status}</td>
        <td>${r.date_in || "-"}</td>
      </tr>
    `;
  });

  html += "</tbody></table>";

  document.getElementById("tableContainer").innerHTML = html;
}

// ===== EXTRACT CODE =====
function extractCode(text){
  try{
    const j = JSON.parse(text);
    return j.code || text;
  }catch{
    return text;
  }
}

// ===== EVENTS =====
document.getElementById("search").oninput = renderTable;
document.getElementById("filter").onchange = renderTable;

// ===== EXPORT =====
function exportCSV(){
  let csv = "Battery,Vehicle IN,Vehicle OUT,Status,Date\n";

  currentData.forEach(r=>{
    const code = extractCode(r.battery_id);
    const status = r.time_out === null ? "IN" : "OUT";

    csv += `${code},${r.vehicle_in},${r.vehicle_out},${status},${r.date_in}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "battery_data.csv";
  a.click();
}

// ===== INIT =====
loadData();
</script>

</body>
</html>
