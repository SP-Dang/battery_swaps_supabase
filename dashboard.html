<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8">
  <title>LSM Command Center</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; padding: 20px; }
    .header { margin-bottom: 30px; text-align: center; }
    
    /* Grid for the Big Numbers */
    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 20px; 
      margin-bottom: 30px; 
    }

    .stat-card { 
      background: #2c3e50; 
      padding: 25px; 
      border-radius: 15px; 
      text-align: center; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .stat-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #bdc3c7; margin-bottom: 10px; }
    .stat-number { font-size: 54px; font-weight: 900; }

    /* Specific Colors */
    .green { color: #2ecc71; border-bottom: 5px solid #2ecc71; } /* Batteries IN */
    .red { color: #e74c3c; border-bottom: 5px solid #e74c3c; }   /* Batteries OUT */
    .blue { color: #3498db; border-bottom: 5px solid #3498db; }  /* Total Swaps Today */
    .black { color: #ffffff; background: #000; border-bottom: 5px solid #555; } /* Vehicle Stats */

    #live-feed { background: #333; border-radius: 10px; padding: 15px; max-width: 800px; margin: 0 auto; text-align: left; }
    .feed-item { border-bottom: 1px solid #444; padding: 10px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="color: #FF4500; margin-bottom: 0;">LSM COMMAND CENTER</h1>
    <div style="font-style: italic; color: #888;">Live Fleet Intelligence by Somphone</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Batteries Currently IN</div>
      <div id="count-in" class="stat-number green">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Batteries Logged OUT</div>
      <div id="count-out" class="stat-number red">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Total Swaps (Today)</div>
      <div id="count-swaps" class="stat-number blue">0</div>
    </div>

    <div class="stat-card black">
      <div class="stat-label" style="color: #aaa;">Vehicle Activity</div>
      <div id="vehicle-stat" style="font-size: 18px; margin-top: 15px;">Loading...</div>
    </div>
  </div>

  <h3>Live Activity Stream</h3>
  <div id="live-feed">Waiting for data...</div>

  <script>
    const supabaseUrl = 'https://bdcwfgutqnfhacanswlk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkY3dmZ3V0cW5maGFjYW5zd2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTg0NzMsImV4cCI6MjA5MDI3NDQ3M30.qHTe6H5ca5PQ9RahiIdrGc4eOMMJrZrSsACAl5mJm4A';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function refreshDashboard() {
      const today = new Date().toISOString().split('T')[0];

      // A. Count Batteries IN (where time_out is NULL)
      const { count: countIn } = await _supabase.from('battery_swaps').select('*', { count: 'exact', head: true }).is('time_out', null);
      document.getElementById('count-in').innerText = countIn || 0;

      // B. Count Batteries OUT (where time_out is NOT NULL)
      const { count: countOut } = await _supabase.from('battery_swaps').select('*', { count: 'exact', head: true }).not('time_out', 'is', null).eq('date_out', today);
      document.getElementById('count-out').innerText = countOut || 0;

      // C. Total Swaps (Everything today)
      const { count: countTotal } = await _supabase.from('battery_swaps').select('*', { count: 'exact', head: true }).eq('date_in', today);
      document.getElementById('count-swaps').innerText = countTotal || 0;

      // D. Vehicle Swaps (From your new VIEW)
      const { data: vData } = await _supabase.from('vehicle_swap_counts').select('*').order('total_swaps', { ascending: false }).limit(1);
      if (vData && vData.length > 0) {
        document.getElementById('vehicle-stat').innerHTML = `Top: <b>${vData[0].vehicle_no}</b><br><span style="font-size:32px;">${vData[0].total_swaps} Swaps</span>`;
      }
    }

    // Live Listener
    _supabase.channel('custom-all-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'battery_swaps' }, (payload) => {
          refreshDashboard();
          updateFeed(payload.new || payload.old);
      }).subscribe();

    function updateFeed(data) {
        const feed = document.getElementById('live-feed');
        const item = document.createElement('div');
        item.className = 'feed-item';
        item.innerHTML = `[${new Date().toLocaleTimeString()}] <b>${data.battery_id}</b> - Action detected for Vehicle ${data.vehicle_in || '?'}`;
        feed.prepend(item);
    }

    refreshDashboard(); // Initial load
  </script>
</body>
</html>
