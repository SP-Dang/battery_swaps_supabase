<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LSM Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:sans-serif;background:#f4f6f8;margin:0}
.container{max-width:1100px;margin:auto;padding:20px}

.header{text-align:center;margin-bottom:10px}
.header h1{margin:0}
.lsm{color:#ff4500;font-weight:bold}
.sub{font-size:12px;color:#555}

.nav{display:flex;gap:10px;margin:15px 0}
.nav button{flex:1;padding:12px;border:none;border-radius:8px;background:#ddd;font-weight:bold}
.nav button.active{background:#3498db;color:#fff}

.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:10px}

.row{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;background:#ecf0f1;padding:12px;border-radius:8px;text-align:center;font-weight:bold}

.table{width:100%;border-collapse:collapse}
.table th,.table td{border-bottom:1px solid #ddd;padding:8px}

button{cursor:pointer}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">
<h1><span class="lsm">LSM</span> Battery Swaps Dashboard</h1>
<div class="sub">Powered by somphone.dang@gmail.com</div>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="tab('overview')" id="t1" class="active">Overview</button>
<button onclick="tab('transactions')" id="t2">Transactions</button>
<button onclick="tab('analytics')" id="t3">Analytics</button>
</div>

<!-- OVERVIEW -->
<div id="overview">

<div class="card">
<div class="row">
<div class="stat" id="in">IN: 0</div>
<div class="stat" id="out">OUT: 0</div>
<div class="stat" id="stay">Stay: 0</div>
<div class="stat" id="swap">Swaps: 0</div>
</div>
</div>

<div class="card">
<div class="row">
<div class="stat" id="revenue">Revenue: 0</div>
</div>
</div>

<div class="card">
<h3>Vehicle Frequency (Today)</h3>
<div id="vehicleStats"></div>
</div>

</div>

<!-- TRANSACTIONS -->
<div id="transactions" style="display:none">

<div class="card">
<div class="row">
<input type="date" id="from">
<input type="date" id="to">
<input id="search" placeholder="Search Battery">
</div>

<div class="row">
<button onclick="loadTransactions()">Load</button>
<button onclick="exportCSV()">Export Excel</button>
</div>
</div>

<div class="card" id="table"></div>

</div>

<!-- ANALYTICS -->
<div id="analytics" style="display:none">

<div class="card">
<canvas id="chart1"></canvas>
</div>

<div class="card">
<canvas id="chart2"></canvas>
</div>

<div class="card" id="topVehicles"></div>

</div>

</div>

<script>
const db = supabase.createClient(
"https://bdcwfgutqnfhacanswlk.supabase.co",
"YOUR_PUBLIC_ANON_KEY"
);

const PRICE = 15000; // adjust per swap

let chart1, chart2;

// ===== TAB =====
function tab(t){
  ["overview","transactions","analytics"].forEach(id=>{
    document.getElementById(id).style.display="none";
  });
  document.getElementById(t).style.display="block";

  ["t1","t2","t3"].forEach(id=>document.getElementById(id).classList.remove("active"));
  event.target.classList.add("active");
}

// ===== UTIL =====
function code(x){
  try{return JSON.parse(x).code}catch{return x}
}

// ===== OVERVIEW =====
async function loadOverview(){

  const today = new Date().toISOString().split("T")[0];

  const {data} = await db
    .from("battery_swaps")
    .select("*")
    .eq("date_in", today);

  let IN=0, OUT=0, stay=0;

  const vehicleMap={};

  data.forEach(r=>{
    IN++;
    if(r.time_out) OUT++;
    else stay++;

    const v=r.vehicle_in;
    vehicleMap[v]=(vehicleMap[v]||0)+1;
  });

  const swaps = OUT;
  const revenue = swaps * PRICE;

  document.getElementById("in").innerText="IN: "+IN;
  document.getElementById("out").innerText="OUT: "+OUT;
  document.getElementById("stay").innerText="Stay: "+stay;
  document.getElementById("swap").innerText="Swaps: "+swaps;
  document.getElementById("revenue").innerText="Revenue: "+revenue;

  let v1=0,v2=0,v3=0;

  Object.values(vehicleMap).forEach(c=>{
    if(c==1) v1++;
    if(c==2) v2++;
    if(c>=3) v3++;
  });

  document.getElementById("vehicleStats").innerHTML =
    `1x: ${v1} | 2x: ${v2} | 3x+: ${v3}`;
}

// ===== TRANSACTIONS =====
async function loadTransactions(){

  let q = db.from("battery_swaps").select("*");

  const from=document.getElementById("from").value;
  const to=document.getElementById("to").value;
  const s=document.getElementById("search").value.toUpperCase();

  if(from) q=q.gte("date_in",from);
  if(to) q=q.lte("date_in",to);

  const {data} = await q.order("id",{ascending:false}).limit(200);

  let html="<table class='table'><tr><th>Battery</th><th>Vehicle</th><th>Status</th></tr>";

  data.forEach(r=>{
    const c=code(r.battery_id);
    if(s && !c.includes(s)) return;

    html+=`<tr>
    <td>${c}</td>
    <td>${r.vehicle_in}</td>
    <td>${r.time_out?"OUT":"IN"}</td>
    </tr>`;
  });

  html+="</table>";

  document.getElementById("table").innerHTML=html;
}

// ===== EXPORT =====
async function exportCSV(){

  const {data} = await db.from("battery_swaps").select("*");

  let csv="Battery,Vehicle,Status\n";

  data.forEach(r=>{
    csv+=`${code(r.battery_id)},${r.vehicle_in},${r.time_out?"OUT":"IN"}\n`;
  });

  const blob=new Blob([csv]);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="data.csv";
  a.click();
}

// ===== ANALYTICS =====
async function loadAnalytics(){

  const {data} = await db.from("battery_swaps").select("*");

  const map={}, revMap={}, vehicleMap={};

  data.forEach(r=>{
    if(r.date_in){
      map[r.date_in]=(map[r.date_in]||0)+1;
      revMap[r.date_in]=(revMap[r.date_in]||0)+(r.time_out?PRICE:0);
    }

    vehicleMap[r.vehicle_in]=(vehicleMap[r.vehicle_in]||0)+1;
  });

  const labels=Object.keys(map);

  if(chart1) chart1.destroy();
  chart1=new Chart(chart1=document.getElementById("chart1"),{
    type:"line",
    data:{labels,datasets:[{label:"Swaps",data:labels.map(d=>map[d])}]}
  });

  if(chart2) chart2.destroy();
  chart2=new Chart(chart2=document.getElementById("chart2"),{
    type:"bar",
    data:{labels,datasets:[{label:"Revenue",data:labels.map(d=>revMap[d])}]}
  });

  let top=Object.entries(vehicleMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

  let html="<h3>Top Vehicles</h3>";
  top.forEach(([v,c])=>html+=`<div>${v} (${c})</div>`);

  document.getElementById("topVehicles").innerHTML=html;
}

// ===== INIT =====
loadOverview();
loadTransactions();
loadAnalytics();

setInterval(loadOverview,5000);
</script>

</body>
</html>
