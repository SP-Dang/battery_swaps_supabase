<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LSM Battery Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:sans-serif;background:#f4f6f8;margin:0}
.container{max-width:1200px;margin:auto;padding:20px}

.header{text-align:center}
.lsm{color:#ff4500;font-weight:bold}

/* NAV */
.nav{display:flex;gap:10px;margin:20px 0}
.nav button{flex:1;padding:12px;border:none;border-radius:8px;background:#ddd;font-weight:bold}
.nav button.active{background:#3498db;color:#fff}

/* CARD */
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}

/* KPI */
.row{display:flex;gap:10px}
.stat{flex:1;padding:15px;border-radius:10px;color:#fff;text-align:center;font-weight:bold}
.in{background:#27ae60}
.out{background:#e67e22}
.stay{background:#8e44ad}
.swap{background:#3498db}
.rev{background:#2c3e50}

/* SPLIT */
.split{display:flex;gap:10px}
.left{flex:3}
.right{flex:1;display:flex;flex-direction:column;gap:10px}

/* TABLE */
.table-container{max-height:400px;overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{border-bottom:1px solid #ddd;padding:8px;text-align:center}
.table th{position:sticky;top:0;background:#fff}

/* FILTER */
.filter-row{display:flex;justify-content:space-between;gap:10px}
.left-inputs{display:flex;gap:5px}
.left-inputs input{width:130px;padding:8px}
.search{width:180px;padding:8px}

/* CHART */
.bar{background:#3498db;color:#fff;margin:3px 0;padding:5px}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1><span class="lsm">LSM</span> Battery Swaps Dashboard</h1>
<div>Powered by somphone.dang@gmail.com</div>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="tab('overview', this)" class="active">Overview</button>
<button onclick="tab('transactions', this)">Transactions</button>
<button onclick="tab('analytics', this)">Financial</button>
</div>

<!-- OVERVIEW -->
<div id="overview">

<div class="card">
<div class="row">
<div class="stat in" id="in"></div>
<div class="stat out" id="out"></div>
<div class="stat stay" id="stay"></div>
<div class="stat swap" id="swap"></div>
<div class="stat rev" id="revenue"></div>
</div>
</div>

<div class="split">

<div class="card left">
<h3>🚗 Vehicle Activity</h3>
<div class="table-container">
<div id="vehicleTable"></div>
</div>
</div>

<div class="right">

<div class="card">
<h3>⚠️ Battery Alerts</h3>
<div id="alerts"></div>
</div>

<div class="card">
<h3>🔁 Frequent Vehicles</h3>
<div id="freq"></div>
</div>

</div>

</div>

</div>

<!-- TRANSACTIONS -->
<div id="transactions" style="display:none">

<div class="card">
<div class="filter-row">
<div class="left-inputs">
<input type="date" id="from">
<input type="date" id="to">
</div>

<div>
<input id="searchBattery" class="search" placeholder="Battery">
<input id="searchVehicle" class="search" placeholder="Vehicle">
</div>
</div>

<button onclick="exportCSV()">Export</button>
</div>

<div class="card table-container" id="table"></div>

</div>

<!-- ANALYTICS -->
<div id="analytics" style="display:none">

<div class="card">
<h3>💰 Financial Summary</h3>
<div id="finance"></div>
<button onclick="exportCSV()">Export</button>
</div>

<div class="card">
<h3>📊 Last 7 Days</h3>
<div id="chart"></div>
</div>

</div>

</div>

<script>
const db = supabase.createClient(
"https://bdcwfgutqnfhacanswlk.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkY3dmZ3V0cW5maGFjYW5zd2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTg0NzMsImV4cCI6MjA5MDI3NDQ3M30.qHTe6H5ca5PQ9RahiIdrGc4eOMMJrZrSsACAl5mJm4A"
);

const PRICE = 15000;
let cachedData=[];

// TAB
function tab(t,el){
document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
el.classList.add("active");

["overview","transactions","analytics"].forEach(x=>{
document.getElementById(x).style.display="none";
});
document.getElementById(t).style.display="block";
}

// UTIL
function code(x){try{return JSON.parse(x).code}catch{return x}}

// OVERVIEW
async function loadOverview(){

const now = new Date();
const today = now.getFullYear() + "-" +
  String(now.getMonth()+1).padStart(2,"0") + "-" +
  String(now.getDate()).padStart(2,"0");

const {data, error} = await db
  .from("battery_swaps")
  .select("*")
  .eq("date_in", today);

if(error){
  console.error(error);
  alert("DB Error: " + error.message);
  return;
}

if(!data || data.length === 0){
  vehicleTable.innerHTML = "No data today";
  return;
}

let IN=0,OUT=0,stay=0;

data.forEach(r=>{
IN++;
if(r.time_out) OUT++;
else stay++;
});

document.getElementById("in").innerText = "IN: " + IN;
document.getElementById("out").innerText = "OUT: " + OUT;
document.getElementById("stay").innerText = "Stay: " + stay;
document.getElementById("swap").innerText = "Swaps: " + OUT;
const revenueValue = OUT * PRICE;
document.getElementById("revenue").innerText =
  "Revenue: ₭" + revenueValue.toLocaleString();


renderVehicle(data);
renderAlerts(data);
renderFreq(data);
}

// VEHICLE
function renderVehicle(data){

let html=`<table class="table"><tr>
<th>Vehicle</th><th>Battery</th><th>Model</th><th>Mileage</th><th>Status</th>
</tr>`;

data.forEach(r=>{

let isAlert = false;

if(r.mileage_in && r.mileage_out){
  let diff = r.mileage_out - r.mileage_in;
  if(diff < 50) isAlert = true;
}

html+=`<tr style="${isAlert ? 'background:#ffe6e6;font-weight:bold;' : ''}">
<td>${r.vehicle_in||"-"}</td>
<td>${code(r.battery_id)}</td>
<td>${r.model||"-"}</td>
<td>${r.mileage_in||"-"}</td>
<td>${r.time_out?"OUT":"IN"}</td>
</tr>`;
});

html+="</table>";

vehicleTable.innerHTML=html;
}

// ALERT
function renderAlerts(data){
let a=[];
data.forEach(r=>{
if(r.mileage_in&&r.mileage_out){
let d=r.mileage_out-r.mileage_in;
if(d<50)a.push(`${code(r.battery_id)} | ${r.vehicle_in} | ${d}km`);
}
});
alerts.innerHTML=a.length?a.join("<br>"):"✅ Normal";
}

// FREQ
function renderFreq(data){
let map={};
data.forEach(r=>{
if(!r.vehicle_in)return;
if(!map[r.vehicle_in])map[r.vehicle_in]=[];
map[r.vehicle_in].push(r);
});

let html="";
Object.entries(map).forEach(([v,arr])=>{
if(arr.length>=2){
html+=`<div><b>${v}</b> (${arr.length})<br>`;
arr.forEach(x=>{
html+=`${code(x.battery_id)} - ${x.time_in}<br>`;
});
html+="</div><hr>";
}
});
freq.innerHTML=html||"No repeat";
}

// TRANSACTIONS
async function loadTransactions(){
let q=db.from("battery_swaps").select("*");

const from=fromInput.value;
const to=toInput.value;
const sb=searchBattery.value.toUpperCase();
const sv=searchVehicle.value.toUpperCase();

if(from)q=q.gte("date_in",from);
if(to)q=q.lte("date_in",to);

const {data}=await q.order("id",{ascending:false}).limit(500);

cachedData=data;

let html=`<table class="table"><tr>
<th>Battery</th><th>Vehicle</th><th>Model</th>
<th>Mileage</th><th>Date</th><th>Status</th>
</tr>`;

data.forEach(r=>{
const c=code(r.battery_id);
if(sb && !c.includes(sb)) return;
if(sv && !(r.vehicle_in||"").toUpperCase().includes(sv)) return;

html+=`<tr>
<td>${c}</td>
<td>${r.vehicle_in||"-"}</td>
<td>${r.model||"-"}</td>
<td>${r.mileage_in||"-"}</td>
<td>${r.date_in||"-"}</td>
<td>${r.time_out?"OUT":"IN"}</td>
</tr>`;
});

html+="</table>";
table.innerHTML=html;
}

// EVENTS
const fromInput=document.getElementById("from");
const toInput=document.getElementById("to");

[fromInput,toInput,searchBattery,searchVehicle].forEach(e=>{
e.addEventListener("input",loadTransactions);
});

// EXPORT
function exportCSV(){

let csv = "=== TRANSACTIONS ===\n";
csv += "Battery,Vehicle,Model,Date,Status\n";

cachedData.forEach(r=>{
  csv += `${code(r.battery_id)},${r.vehicle_in},${r.model},${r.date_in},${r.time_out?"OUT":"IN"}\n`;
});

// ===== ALERTS
csv += "\n=== BATTERY ALERTS (<50km) ===\n";

cachedData.forEach(r=>{
  if(r.mileage_in && r.mileage_out){
    let diff = r.mileage_out - r.mileage_in;
    if(diff < 50){
      csv += `${code(r.battery_id)},${r.vehicle_in},${diff}km\n`;
    }
  }
});

// ===== FREQUENT VEHICLES
csv += "\n=== FREQUENT VEHICLES (2+ swaps) ===\n";

let map = {};

cachedData.forEach(r=>{
  if(!r.vehicle_in) return;
  if(!map[r.vehicle_in]) map[r.vehicle_in] = [];
  map[r.vehicle_in].push(r);
});

Object.entries(map).forEach(([v, arr])=>{
  if(arr.length >= 2){
    csv += `${v} (${arr.length} times)\n`;
    arr.forEach(x=>{
      csv += `  - ${code(x.battery_id)} @ ${x.time_in}\n`;
    });
  }
});

// DOWNLOAD
const blob = new Blob([csv]);
const a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "LSM_Report.csv";
a.click();
}


// FINANCIAL
async function loadAnalytics(){
const {data}=await db.from("battery_swaps").select("*");

let total=0;
let map={};

data.forEach(r=>{
if(r.time_out){
total+=PRICE;
map[r.date_in]=(map[r.date_in]||0)+1;
}
});

finance.innerText="Total Revenue: "+total+" LAK";

let html="";
Object.entries(map).slice(-7).forEach(([d,c])=>{
html+=`<div class="bar">${d}: ${c}</div>`;
});
chart.innerHTML=html;
}

// INIT
loadOverview();
loadTransactions();
loadAnalytics();

// REALTIME
db.channel("rt")
.on("postgres_changes",{event:"*",schema:"public",table:"battery_swaps"},()=>{
loadOverview();
loadTransactions();
loadAnalytics();
}).subscribe();
</script>

</body>
</html>
