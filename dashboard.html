<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8">
  <title>LSM Command Center</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: white; padding: 20px; }
    .header { margin-bottom: 30px; text-align: center; }
    
    /* Statistics Grid (Top Row) */
    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 20px; 
      margin-bottom: 30px; 
    }

    .stat-card { 
      background: #2c3e50; 
      padding: 20px; 
      border-radius: 12px; 
      text-align: center; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: #95a5a6; margin-bottom: 8px; font-weight: bold; }
    .stat-number { font-size: 42px; font-weight: 900; line-height: 1; }

    /* Colors */
    .green { color: #2ecc71; border-bottom: 4px solid #2ecc71; } 
    .red { color: #e74c3c; border-bottom: 4px solid #e74c3c; }   
    .blue { color: #3498db; border-bottom: 4px solid #3498db; }  
    .black { background: #000; border: 1px solid #333; text-align: left; }

    /* Report Section (Side-by-Side) */
    .reports-container {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap; /* Allows stacking on small mobile screens */
    }

    .report-card {
      flex: 1;
      min-width: 300px;
      background: #111;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #333;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th { color: #7f8c8d; text-align: left; padding: 8px; border-bottom: 1px solid #333; text-transform: uppercase; font-size: 10px; }
    td { padding: 8px; border-bottom: 1px solid #222; }

    /* Activity Feed */
    #live-feed { background: #222; border-radius: 10px; padding: 15px; border: 1px solid #333; max-height: 300px; overflow-y: auto; }
    .feed-item { border-bottom: 1px solid #333; padding: 10px; font-size: 13px; color: #ccc; display: flex; justify-content: space-between; }
    .feed-item b { color: #FF4500; }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="color: #FF4500; margin-bottom: 5px; letter-spacing: 2px;">LSM COMMAND CENTER</h1>
    <div style="font-style: italic; color: #7f8c8d; font-size: 14px;">Powered by Somphone &bull; Fleet Intelligence</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Currently in Shop</div>
      <div id="count-in" class="stat-number green">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Dispatched Today</div>
      <div id="count-out" class="stat-number red">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Swaps (24H)</div>
      <div id="count-swaps" class="stat-number blue">0</div>
    </div>
  </div>

  <div class="reports-container">
    <div class="report-card">
      <div class="stat-label">📈 Last 7 Days (Operations)</div>
      <div id="daily-report-table">Loading daily data...</div>
    </div>

    <div class="report-card">
      <div class="stat-label">🗓️ Weekly Overview</div>
      <div id="weekly-report-table">Loading weekly data...</div>
    </div>
  </div>

  <h3 style="text-align: center; color: #555; text-transform: uppercase; font-size: 12px; margin-bottom: 10px;">Live Activity Stream</h3>
  <div id="live-feed">Connecting to LSM database...</div>

  <script>
    // 1. DATABASE CONNECTION
    const supabaseUrl = 'https://bdcwfgutqnfhacanswlk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkY3dmZ3V0cW5maGFjYW5zd2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTg0NzMsImV4cCI6MjA5MDI3NDQ3M30.qHTe6H5ca5PQ9RahiIdrGc4eOMMJrZrSsACAl5mJm4A';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // 2. THE REFRESH ENGINE
    async function refreshDashboard() {
      const today = new Date().toISOString().split('T')[0];

      // A. Big Numbers
      const { count: countIn } = await _supabase.from('battery_swaps').select('*', { count: 'exact', head: true }).is('time_out', null);
      document.getElementById('count-in').innerText = countIn || 0;

      const { count: countOut } = await _supabase.from('battery_swaps').select('*', { count: 'exact', head: true }).not('time_out', 'is', null).eq('date_out', today);
      document.getElementById('count-out').innerText = countOut || 0;

      const { count: countTotal } = await _supabase.from('battery_swaps').select('*', { count: 'exact', head: true }).eq('date_in', today);
      document.getElementById('count-swaps').innerText = countTotal || 0;

      // B. Load Daily Report
      const { data: dData } = await _supabase.from('daily_ops_summary').select('*').limit(7);
      renderTable('daily-report-table', dData, 'date_in');

      // C. Load Weekly Report
      const { data: wData } = await _supabase.from('weekly_ops_summary').select('*').limit(4);
      renderTable('weekly-report-table', wData, 'week_starting');
    }

    // Helper to draw tables
    function renderTable(elementId, data, dateField) {
      const div = document.getElementById(elementId);
      if (!data) return;

      let html = `<table><tr><th>Date</th><th>IN</th><th>OUT</th><th>NET</th></tr>`;
      data.forEach(row => {
        const balanceColor = row.net_balance > 0 ? '#e74c3c' : '#2ecc71';
        html += `<tr>
                   <td>${row[dateField]}</td>
                   <td>${row.total_in}</td>
                   <td>${row.total_out}</td>
                   <td style="color:${balanceColor}; font-weight:bold;">${row.net_balance}</td>
                 </tr>`;
      });
      html += "</table>";
      div.innerHTML = html;
    }

    // 3. THE LIVE LISTENER
    _supabase.channel('lsm-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'battery_swaps' }, (payload) => {
          refreshDashboard(); 
          updateFeed(payload.new || payload.old);
      })
      .subscribe();

    // 4. THE ACTIVITY FEED
    function updateFeed(data) {
        const feed = document.getElementById('live-feed');
        if (feed.innerText.includes("Connecting")) feed.innerHTML = "";
        
        const timestamp = new Date().toLocaleTimeString('en-GB', { hour12: false });
        const item = document.createElement('div');
        item.className = 'feed-item';
        
        let status = data.time_out ? "Logged OUT" : "Logged IN";
        let v_no = data.time_out ? data.vehicle_out : data.vehicle_in;

        item.innerHTML = `<span>Battery <b>${data.battery_id}</b> ${status} (${v_no || '?'})</span> 
                          <span style="color:#555;">${timestamp}</span>`;
        feed.prepend(item);
        if (feed.children.length > 8) feed.lastElementChild.remove();
    }

    // INITIAL STARTUP
    refreshDashboard();
  </script>
</body>
</html>
