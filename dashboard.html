<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LSM Battery Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:sans-serif;background:#f4f6f8;margin:0}
.container{max-width:1200px;margin:auto;padding:20px}

.header{text-align:center}
.lsm{color:#ff4500;font-weight:bold}

/* NAV */
.nav{display:flex;gap:10px;margin:20px 0}
.nav button{flex:1;padding:12px;border:none;border-radius:8px;background:#ddd;font-weight:bold}
.nav button.active{background:#3498db;color:#fff}

/* CARDS */
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}

/* KPI */
.row{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;padding:15px;border-radius:10px;color:#fff;text-align:center;font-weight:bold}
.in{background:#27ae60}
.out{background:#e67e22}
.stay{background:#8e44ad}
.swap{background:#3498db}
.rev{background:#2c3e50}

/* SPLIT */
.split{display:flex;gap:10px}
.left{flex:2}
.right{flex:1}

/* TABLE */
.table-container{max-height:400px;overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:center;
}
.table th{
  position:sticky;
  top:0;
  background:#fff;
}

/* ALERT ROW */
.bad-row{background:#ffe6e6}

/* FILTER */
.filter-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.left-inputs{display:flex;gap:5px}
.left-inputs input{width:120px;padding:8px}
.search{width:200px;padding:8px}

/* MODAL */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}
.modal-content{
  background:#fff;
  padding:20px;
  border-radius:10px;
  width:400px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1><span class="lsm">LSM</span> Battery Swaps Dashboard</h1>
<div>Powered by somphone.dang@gmail.com</div>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="tab('overview', this)" class="active">Overview</button>
<button onclick="tab('transactions', this)">Transactions</button>
<button onclick="tab('analytics', this)">Analytics</button>
</div>

<!-- OVERVIEW -->
<div id="overview">

<div class="card">
<div class="row">
<div class="stat in" id="in"></div>
<div class="stat out" id="out"></div>
<div class="stat stay" id="stay"></div>
<div class="stat swap" id="swap"></div>
<div class="stat rev" id="revenue"></div>
</div>
</div>

<div class="split">

<div class="card left">
<h3>🚗 Vehicle Activity</h3>
<div class="table-container">
<div id="vehicleTable"></div>
</div>
</div>

<div class="card right">
<h3>⚠️ Battery Alerts</h3>
<div id="alerts"></div>
</div>

</div>

</div>

<!-- TRANSACTIONS -->
<div id="transactions" style="display:none">

<div class="card">
<div class="filter-row">
<div class="left-inputs">
<input type="date" id="from">
<input type="date" id="to">
</div>
<input id="search" class="search" placeholder="Search Battery">
</div>

<button onclick="loadTransactions()">Load</button>
<button onclick="exportCSV()">Export</button>
</div>

<div class="card table-container" id="table"></div>

</div>

<!-- ANALYTICS -->
<div id="analytics" style="display:none">

<div class="card">
<h3>🔋 Inventory (IN Shop)</h3>
<div id="inventory"></div>
</div>

</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content" id="modalContent"></div>
</div>

<script>
const db = supabase.createClient(
"https://bdcwfgutqnfhacanswlk.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkY3dmZ3V0cW5maGFjYW5zd2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTg0NzMsImV4cCI6MjA5MDI3NDQ3M30.qHTe6H5ca5PQ9RahiIdrGc4eOMMJrZrSsACAl5mJm4A"
);

const PRICE = 15000;

let cachedData = []; // store filtered data

// ===== TAB (FIXED ACTIVE STATE)
function tab(t, el){
  ["overview","transactions","analytics"].forEach(x=>{
    document.getElementById(x).style.display="none";
  });

  document.getElementById(t).style.display="block";

  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.remove("active");
  });

  el.classList.add("active");
}

// ===== UTIL
function code(x){
  try{return JSON.parse(x).code}catch{return x}
}

// ===== OVERVIEW
async function loadOverview(){

  const today = new Date().toISOString().split("T")[0];

  const {data} = await db
    .from("battery_swaps")
    .select("*")
    .eq("date_in", today);

  let IN=0, OUT=0, stay=0;

  data.forEach(r=>{
    IN++;
    if(r.time_out) OUT++; else stay++;
  });

  document.getElementById("in").innerText="IN: "+IN;
  document.getElementById("out").innerText="OUT: "+OUT;
  document.getElementById("stay").innerText="Stay: "+stay;
  document.getElementById("swap").innerText="Swaps: "+OUT;
  document.getElementById("revenue").innerText="Revenue: "+(OUT*PRICE)+" LAK";

  renderVehicleTable(data);
  renderAlerts(data);
  renderFrequency(data);
}

// ===== VEHICLE TABLE
function renderVehicleTable(data){

  let html=`<table class="table">
  <tr>
  <th>Vehicle</th>
  <th>Battery</th>
  <th>Model</th>
  <th>Mileage</th>
  <th>Status</th>
  </tr>`;

  data.forEach(r=>{
    let diff = r.mileage_out && r.mileage_in ? r.mileage_out-r.mileage_in : 100;

    html+=`
    <tr class="${diff<50?'bad-row':''}">
    <td>${r.vehicle_in||"-"}</td>
    <td>${code(r.battery_id)}</td>
    <td>${r.model||"-"}</td>
    <td>${r.mileage_in||"-"}</td>
    <td>${r.time_out?"OUT":"IN"}</td>
    </tr>`;
  });

  html+="</table>";

  document.getElementById("vehicleTable").innerHTML=html;
}

// ===== ALERT
function renderAlerts(data){

  let alerts=[];

  data.forEach(r=>{
    if(r.mileage_in && r.mileage_out){
      let diff=r.mileage_out-r.mileage_in;
      if(diff<50){
        alerts.push(`
        <div>
        <b>${code(r.battery_id)}</b><br>
        Vehicle: ${r.vehicle_in}<br>
        ${diff} km
        </div><hr>`);
      }
    }
  });

  document.getElementById("alerts").innerHTML =
    alerts.length ? alerts.join("") : "✅ All normal";
}

// ===== NEW: VEHICLE FREQUENCY CARD
function renderFrequency(data){

  let map = {};

  data.forEach(r=>{
    const v = r.vehicle_in;
    if(!v) return;

    if(!map[v]) map[v]=[];
    map[v].push(r);
  });

  let html="<h3>🔁 Frequent Vehicles</h3>";

  Object.entries(map).forEach(([v, arr])=>{
    if(arr.length >= 2){
      html+=`<div><b>${v}</b> (${arr.length} times)<br>`;

      arr.forEach(x=>{
        html+=`${code(x.battery_id)} - ${x.time_in}<br>`;
      });

      html+="</div><hr>";
    }
  });

  // create card dynamically
  let card = document.getElementById("freqCard");
  if(!card){
    card = document.createElement("div");
    card.className="card right";
    card.id="freqCard";
    document.querySelector(".split").appendChild(card);
  }

  card.innerHTML = html || "No repeated vehicles";
}

// ===== TRANSACTIONS (FIXED FILTER)
async function loadTransactions(){

  let q = db.from("battery_swaps").select("*");

  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const s = document.getElementById("search").value.toUpperCase();

  if(from) q = q.gte("date_in", from);
  if(to) q = q.lte("date_in", to);

  const {data} = await q.order("id",{ascending:false}).limit(500);

  cachedData = data; // store for export

  let html=`<table class="table">
  <tr>
  <th>Battery</th>
  <th>Model</th>
  <th>Vehicle</th>
  <th>Mileage</th>
  <th>Date</th>
  <th>Time</th>
  <th>Status</th>
  </tr>`;

  data.forEach(r=>{
    const c = code(r.battery_id);

    if(s && !c.includes(s)) return;

    html+=`
    <tr>
    <td>${c}</td>
    <td>${r.model||"-"}</td>
    <td>${r.vehicle_in||"-"}</td>
    <td>${r.mileage_in||"-"}</td>
    <td>${r.date_in||"-"}</td>
    <td>${r.time_in||"-"}</td>
    <td>${r.time_out?"OUT":"IN"}</td>
    </tr>`;
  });

  html+="</table>";

  document.getElementById("table").innerHTML = html;
}

// ===== AUTO FILTER (NEW)
document.getElementById("from").addEventListener("change", loadTransactions);
document.getElementById("to").addEventListener("change", loadTransactions);
document.getElementById("search").addEventListener("input", loadTransactions);

// ===== EXPORT (FIXED)
function exportCSV(){

  let csv="Battery,Model,Vehicle,Mileage,Date,Time,Status\n";

  cachedData.forEach(r=>{
    csv+=`${code(r.battery_id)},${r.model},${r.vehicle_in},${r.mileage_in},${r.date_in},${r.time_in},${r.time_out?"OUT":"IN"}\n`;
  });

  const blob=new Blob([csv]);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="transactions.csv";
  a.click();
}

// ===== INVENTORY
async function loadInventory(){

  const {data}=await db.from("battery_swaps").select("*");

  let active=data.filter(r=>r.time_out===null);

  let html="<table class='table'><tr><th>Battery</th><th>Vehicle</th></tr>";

  active.forEach(r=>{
    html+=`<tr><td>${code(r.battery_id)}</td><td>${r.vehicle_in}</td></tr>`;
  });

  html+="</table>";

  document.getElementById("inventory").innerHTML=html;
}

// ===== INIT
loadOverview();
loadTransactions();
loadInventory();

// ===== REALTIME
db.channel('realtime-swaps')
.on('postgres_changes',{event:'*',schema:'public',table:'battery_swaps'},
()=>{
  loadOverview();
  loadTransactions();
  loadInventory();
})
.subscribe();
</script>

</body>
</html>
