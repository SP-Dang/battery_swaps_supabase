<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LSM Battery Dashboard V2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:sans-serif;background:#f4f6f8;margin:0}
.container{max-width:1100px;margin:auto;padding:20px}

.nav{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}
.nav button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  background:#ddd;
}
.nav button.active{background:#3498db;color:#fff}

.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:15px}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1}

.stat{text-align:center;padding:15px;border-radius:10px;background:#ecf0f1;font-weight:bold}

.table{width:100%;border-collapse:collapse}
.table th,.table td{border-bottom:1px solid #ddd;padding:8px}

button{cursor:pointer}

</style>
</head>

<body>

<div class="container">

<!-- NAV -->
<div class="nav">
<button onclick="showTab('overview')" id="tab-overview" class="active">Overview</button>
<button onclick="showTab('transactions')" id="tab-transactions">Transactions</button>
<button onclick="showTab('analytics')" id="tab-analytics">Analytics</button>
</div>

<!-- OVERVIEW -->
<div id="overview" class="tab">

<div class="card">
<div class="row">
<div class="stat" id="inCount">IN: 0</div>
<div class="stat" id="outCount">OUT: 0</div>
<div class="stat" id="todayCount">Today: 0</div>
</div>
</div>

<div class="card">
<h3>🚨 Alerts</h3>
<div id="alerts">Checking...</div>
</div>

<div class="card">
<canvas id="smallChart"></canvas>
</div>

</div>

<!-- TRANSACTIONS -->
<div id="transactions" class="tab" style="display:none">

<div class="card">
<div class="row">
<input type="date" id="fromDate">
<input type="date" id="toDate">
</div>

<div class="row">
<input id="search" placeholder="Search Battery">
<select id="filter">
<option value="">All</option>
<option value="IN">IN</option>
<option value="OUT">OUT</option>
</select>
</div>

<div class="row">
<button onclick="loadTransactions()">Load</button>
<button onclick="nextPage()">Next</button>
<button onclick="prevPage()">Prev</button>
</div>

</div>

<div class="card" id="tableContainer"></div>

</div>

<!-- ANALYTICS -->
<div id="analytics" class="tab" style="display:none">

<div class="card">
<canvas id="mainChart"></canvas>
</div>

<div class="card" id="topBatteries"></div>

</div>

</div>

<script>
const db = supabase.createClient(
  "https://bdcwfgutqnfhacanswlk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkY3dmZ3V0cW5maGFjYW5zd2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTg0NzMsImV4cCI6MjA5MDI3NDQ3M30.qHTe6H5ca5PQ9RahiIdrGc4eOMMJrZrSsACAl5mJm4A"
);

let page = 0;
let pageSize = 50;
let dataStore = [];
let smallChart, mainChart;

// ===== TAB =====
function showTab(tab){
  document.querySelectorAll(".tab").forEach(t=>t.style.display="none");
  document.getElementById(tab).style.display="block";

  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+tab).classList.add("active");
}

// ===== UTIL =====
function extractCode(text){
  try{
    return JSON.parse(text).code || text;
  }catch{return text}
}

// ===== OVERVIEW =====
async function loadOverview(){
  const {data} = await db.from("battery_swaps").select("*").limit(200);

  let inCount=0,outCount=0,todayCount=0;
  const today=new Date().toISOString().split("T")[0];
  const map={};

  data.forEach(r=>{
    if(r.time_out===null) inCount++; else outCount++;
    if(r.date_in===today) todayCount++;

    if(r.date_in){
      map[r.date_in]=(map[r.date_in]||0)+1;
    }
  });

  document.getElementById("inCount").innerText="IN: "+inCount;
  document.getElementById("outCount").innerText="OUT: "+outCount;
  document.getElementById("todayCount").innerText="Today: "+todayCount;

  // chart
  const labels=Object.keys(map);
  const values=labels.map(k=>map[k]);

  if(smallChart) smallChart.destroy();
  smallChart=new Chart(document.getElementById("smallChart"),{
    type:"line",
    data:{labels,datasets:[{data:values,label:"Daily"}]}
  });

  // alerts
  let alerts=[];
  const now=new Date();

  data.forEach(r=>{
    if(r.time_out===null && r.date_in && r.time_in){
      const dt=new Date(r.date_in+"T"+r.time_in);
      const h=(now-dt)/3600000;
      if(h>24) alerts.push(extractCode(r.battery_id));
    }
  });

  document.getElementById("alerts").innerHTML =
    alerts.length ? "⚠️ "+alerts.join(", ") : "✅ OK";
}

// ===== TRANSACTIONS =====
async function loadTransactions(){

  let query = db.from("battery_swaps").select("*");

  const from=document.getElementById("fromDate").value;
  const to=document.getElementById("toDate").value;

  if(from) query=query.gte("date_in",from);
  if(to) query=query.lte("date_in",to);

  query=query.order("id",{ascending:false})
             .range(page*pageSize,(page+1)*pageSize-1);

  const {data} = await query;

  dataStore=data;

  renderTable();
}

// ===== TABLE =====
function renderTable(){

  const search=document.getElementById("search").value.toUpperCase();
  const filter=document.getElementById("filter").value;

  let html="<table class='table'><tr><th>Battery</th><th>IN</th><th>OUT</th><th>Status</th></tr>";

  dataStore.forEach(r=>{
    const code=extractCode(r.battery_id);

    if(search && !code.includes(search)) return;
    if(filter==="IN" && r.time_out!==null) return;
    if(filter==="OUT" && r.time_out===null) return;

    html+=`
    <tr>
    <td>${code}</td>
    <td>${r.vehicle_in||"-"}</td>
    <td>${r.vehicle_out||"-"}</td>
    <td>${r.time_out===null?"IN":"OUT"}</td>
    </tr>`;
  });

  html+="</table>";

  document.getElementById("tableContainer").innerHTML=html;
}

// ===== PAGINATION =====
function nextPage(){page++;loadTransactions();}
function prevPage(){if(page>0){page--;loadTransactions();}}

// ===== ANALYTICS =====
async function loadAnalytics(){

  const {data}=await db.from("battery_swaps").select("*");

  const map={};
  const batteryMap={};

  data.forEach(r=>{
    if(r.date_in){
      map[r.date_in]=(map[r.date_in]||0)+1;
    }

    const code=extractCode(r.battery_id);
    batteryMap[code]=(batteryMap[code]||0)+1;
  });

  const labels=Object.keys(map);
  const values=labels.map(k=>map[k]);

  if(mainChart) mainChart.destroy();
  mainChart=new Chart(document.getElementById("mainChart"),{
    type:"bar",
    data:{labels,datasets:[{data:values,label:"Swaps"}]}
  });

  // top batteries
  let sorted=Object.entries(batteryMap)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,5);

  let html="<h3>Top Batteries</h3>";
  sorted.forEach(([c,v])=>{
    html+=`<div>${c} (${v})</div>`;
  });

  document.getElementById("topBatteries").innerHTML=html;
}

// ===== INIT =====
loadOverview();
loadTransactions();
loadAnalytics();

setInterval(loadOverview,5000);
</script>

</body>
</html>
