<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LSM Battery Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0d10;
  --surface:#121519;
  --surface2:#181d24;
  --surface3:#1e242e;
  --border:#252d3a;
  --border2:#2e3a4a;
  --accent:#00e5a0;
  --accent-dim:rgba(0,229,160,0.12);
  --blue:#0099ff;
  --blue-dim:rgba(0,153,255,0.12);
  --orange:#ff8c42;
  --orange-dim:rgba(255,140,66,0.12);
  --purple:#a855f7;
  --purple-dim:rgba(168,85,247,0.12);
  --red:#ff4d6a;
  --red-dim:rgba(255,77,106,0.1);
  --text:#dde3ee;
  --text-dim:#5a6880;
  --text-mid:#8a98b0;
  --radius:12px;
  --font-mono:'JetBrains Mono',monospace;
  --font-head:'Orbitron',sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:var(--font-mono);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* LAYOUT */
.shell{max-width:1280px;margin:auto;padding:24px 20px}

/* TOPBAR */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
  flex-wrap:wrap;
  gap:16px;
}

.brand{display:flex;align-items:center;gap:14px}
.brand-icon{
  width:48px;height:48px;
  background:var(--accent-dim);
  border:1px solid rgba(0,229,160,0.2);
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
}
.brand-text h1{
  font-family:var(--font-head);
  font-size:1.05rem;
  font-weight:800;
  letter-spacing:0.04em;
}
.brand-text h1 .lsm{color:var(--accent)}
.brand-text small{
  font-size:0.65rem;
  color:var(--text-dim);
  display:block;
  margin-top:2px;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:12px;
}

#liveClock{
  font-size:0.75rem;
  color:var(--text-mid);
  background:var(--surface2);
  padding:8px 14px;
  border-radius:8px;
  border:1px solid var(--border);
}

.live-dot{
  display:inline-block;
  width:6px;height:6px;
  background:var(--accent);
  border-radius:50%;
  margin-right:6px;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,229,160,0.4)}
  50%{opacity:0.7;box-shadow:0 0 0 4px rgba(0,229,160,0)}
}

.refresh-btn{
  padding:8px 16px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text-mid);
  font-family:var(--font-mono);
  font-size:0.75rem;
  cursor:pointer;
  transition:all 0.2s;
}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

/* NAV */
.nav{
  display:flex;
  gap:4px;
  margin-bottom:24px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:4px;
}

.nav button{
  flex:1;
  padding:10px 16px;
  border:none;
  border-radius:8px;
  background:transparent;
  color:var(--text-dim);
  font-family:var(--font-mono);
  font-size:0.8rem;
  font-weight:600;
  cursor:pointer;
  transition:all 0.2s;
  letter-spacing:0.02em;
}

.nav button.active{
  background:var(--surface3);
  color:var(--text);
  border:1px solid var(--border2);
}

/* CARD */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:16px;
}

.card-title{
  font-family:var(--font-head);
  font-size:0.85rem;
  font-weight:700;
  color:var(--text-mid);
  text-transform:uppercase;
  letter-spacing:0.08em;
  margin-bottom:16px;
}

/* KPI GRID */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}

.kpi{
  padding:16px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--surface2);
  text-align:center;
}
.kpi-label{font-size:0.6rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px}
.kpi-value{font-family:var(--font-head);font-size:1.5rem;font-weight:800;line-height:1;letter-spacing:0.04em}
.kpi-sub{font-size:0.6rem;color:var(--text-dim);margin-top:4px}

.kpi.kpi-in .kpi-value{color:var(--accent)}
.kpi.kpi-out .kpi-value{color:var(--orange)}
.kpi.kpi-stay .kpi-value{color:var(--purple)}
.kpi.kpi-swap .kpi-value{color:var(--blue)}
.kpi.kpi-rev .kpi-value{color:var(--text);font-size:0.95rem}

/* SPLIT */
.split{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:16px;
  align-items:start;
}
@media(max-width:768px){.split{grid-template-columns:1fr}}

/* TABLE */
.table-wrap{
  max-height:380px;
  overflow:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:0.78rem;
}
th{
  position:sticky;top:0;
  background:var(--surface);
  color:var(--text-dim);
  font-size:0.65rem;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.08em;
  padding:10px 8px;
  border-bottom:1px solid var(--border);
  z-index:1;
}
td{
  padding:10px 8px;
  border-bottom:1px solid var(--border);
  color:var(--text);
  vertical-align:middle;
}
table th, table td {
  text-align: center;
  vertical-align: middle;
}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}

/* STATUS BADGES */
.badge{
  display:inline-block;
  padding:3px 10px;
  border-radius:20px;
  font-size:0.65rem;
  font-weight:700;
  letter-spacing:0.05em;
}
.badge-in{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(0,229,160,0.2)}
.badge-out{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(255,140,66,0.2)}
.badge-alert{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,106,0.2)}

/* ALERT ITEMS */
.alert-item{
  padding:10px 12px;
  background:var(--red-dim);
  border:1px solid rgba(255,77,106,0.2);
  border-radius:8px;
  margin-bottom:8px;
  font-size:0.75rem;
  line-height:1.6;
}
.alert-item .al-id{font-weight:700;color:var(--red)}
.alert-item .al-detail{color:var(--text-dim);font-size:0.68rem}

.ok-msg{
  text-align:center;
  padding:20px;
  color:var(--text-dim);
  font-size:0.8rem;
}

/* FREQ */
.freq-item{
  padding:10px 12px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:8px;
  font-size:0.75rem;
}
.freq-vehicle{font-weight:700;color:var(--blue)}
.freq-detail{color:var(--text-dim);font-size:0.68rem;line-height:1.6;margin-top:4px}

/* FILTER ROW */
.filter-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin-bottom:16px;
}

.filter-row input{
  padding:9px 12px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-family:var(--font-mono);
  font-size:0.78rem;
  outline:none;
  transition:border-color 0.2s;
}
.filter-row input:focus{border-color:var(--blue)}

.export-btn{
  padding:9px 18px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text-mid);
  font-family:var(--font-mono);
  font-size:0.78rem;
  font-weight:700;
  cursor:pointer;
  transition:all 0.2s;
  margin-left:auto;
}
.export-btn:hover{border-color:var(--accent);color:var(--accent)}

/* CHART BARS */
.chart-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  font-size:0.75rem;
}
.chart-label{width:90px;color:var(--text-dim);flex-shrink:0;text-align:right}
.chart-bar-wrap{flex:1;background:var(--surface2);border-radius:4px;height:22px;position:relative}
.chart-bar{
  height:100%;
  background:linear-gradient(90deg, var(--blue), var(--accent));
  border-radius:4px;
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:8px;
  font-weight:700;font-size:0.7rem;
  color:#000;
  min-width:30px;
  transition:width 0.6s cubic-bezier(0.4,0,0.2,1);
}

/* FINANCE TABLE */
.finance-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--border);
  font-size:0.82rem;
}
.finance-row:last-child{border-bottom:none}
.finance-row .f-label{color:var(--text-dim)}
.finance-row .f-value{font-weight:700;font-family:var(--font-head)}
.finance-row.total .f-label{color:var(--text);font-weight:700}
.finance-row.total .f-value{color:var(--accent);font-size:0.95rem}

/* LOADING */
.skeleton{
  background:linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:6px;
  height:16px;
  margin:4px 0;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.loading-cells td{padding:8px}
</style>
</head>

<body>

<div class="shell">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">🔋</div>
      <div class="brand-text">
        <h1><span class="lsm">LSM</span> Battery Dashboard</h1>
        <small>Real-time swap monitoring</small>
      </div>
    </div>
    <div class="topbar-right">
      <div id="liveClock"><span class="live-dot"></span>Loading...</div>
      <button class="refresh-btn" onclick="reloadAll()">↻ Refresh</button>
    </div>
  </div>

  <!-- NAV -->
  <div class="nav">
    <button onclick="tab('overview',this)" class="active">📊 Overview</button>
    <button onclick="tab('transactions',this)">📋 Transactions</button>
    <button onclick="tab('analytics',this)">💰 Financial</button>
  </div>

  <!-- OVERVIEW -->
  <div id="overview">

    <div class="card">
      <div class="card-title">Today's Summary</div>
      <div class="kpi-grid">
        <div class="kpi kpi-in"><div class="kpi-label">Checked IN</div><div class="kpi-value" id="kIn">-</div><div class="kpi-sub">today</div></div>
        <div class="kpi kpi-out"><div class="kpi-label">Checked OUT</div><div class="kpi-value" id="kOut">-</div><div class="kpi-sub">today</div></div>
        <div class="kpi kpi-stay"><div class="kpi-label">Still In</div><div class="kpi-value" id="kStay">-</div><div class="kpi-sub">on site</div></div>
        <div class="kpi kpi-swap"><div class="kpi-label">Total Swaps</div><div class="kpi-value" id="kSwap">-</div><div class="kpi-sub">completed</div></div>
        <div class="kpi kpi-rev"><div class="kpi-label">Revenue</div><div class="kpi-value" id="kRev">-</div><div class="kpi-sub">LAK today</div></div>
      </div>
    </div>

    <div class="split">
      <div>
        <div class="card">
          <div class="card-title">🚗 Vehicle Activity — Today</div>
          <div class="table-wrap" id="vehicleTable">
            <div class="skeleton" style="height:40px"></div>
            <div class="skeleton" style="height:40px;opacity:.7"></div>
            <div class="skeleton" style="height:40px;opacity:.4"></div>
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="card-title">⚠️ Alerts</div>
          <div id="alerts"><div class="ok-msg">Loading...</div></div>
        </div>
        <div class="card">
          <div class="card-title">🔁 Frequent</div>
          <div id="freq"><div class="ok-msg">Loading...</div></div>
        </div>
      </div>
    </div>

  </div>

  <!-- TRANSACTIONS -->
  <div id="transactions" style="display:none">
    <div class="card">
      <div class="filter-row">
        <input type="date" id="filterFrom">
        <input type="date" id="filterTo">
        <input id="filterBattery" placeholder="🔍 Battery ID" style="width:140px">
        <input id="filterVehicle" placeholder="🔍 Vehicle" style="width:140px">
        <button class="export-btn" onclick="exportCSV()">⬇ Export CSV</button>
      </div>
      <div class="table-wrap" id="txTable">
        <div class="skeleton" style="height:40px;margin-bottom:4px"></div>
        <div class="skeleton" style="height:40px;opacity:.7;margin-bottom:4px"></div>
        <div class="skeleton" style="height:40px;opacity:.4"></div>
      </div>
    </div>
  </div>

  <!-- ANALYTICS -->
  <div id="analytics" style="display:none">
    <div class="split">
      <div class="card">
        <div class="card-title">💰 Financial Summary</div>
        <div id="financeTable"></div>
        <div style="margin-top:16px">
          <button class="export-btn" onclick="exportCSV()">⬇ Export Full Report</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">📊 Last 7 Days — Swaps</div>
        <div id="chart"></div>
      </div>
    </div>
  </div>

</div>

<script>
// ===== CONFIG =====
const SUPABASE_URL = "https://bdcwfgutqnfhacanswlk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkY3dmZ3V0cW5maGFjYW5zd2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTg0NzMsImV4cCI6MjA5MDI3NDQ3M30.qHTe6H5ca5PQ9RahiIdrGc4eOMMJrZrSsACAl5mJm4A";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PRICE = 15000;

// FIX: Separate caches per view — no more shared stale state
let todayData  = [];
let txData     = [];
let allData    = [];

// ===== CLOCK =====
function updateClock(){
  const n = new Date();
  document.getElementById("liveClock").innerHTML =
    `<span class="live-dot"></span>${n.toLocaleDateString("en-CA")} ${n.toLocaleTimeString("en-GB")}`;
}
updateClock();
setInterval(updateClock, 1000);

// ===== TAB =====
function tab(t, el){
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  ["overview","transactions","analytics"].forEach(x =>
    document.getElementById(x).style.display = "none"
  );
  document.getElementById(t).style.display = "block";
}

// ===== UTIL =====
// FIX: code() now just returns the value as-is since we no longer store raw JSON
function code(x){
  try{ const j = JSON.parse(x); return j.code || x; }catch{ return x; }
}

function todayISO(){
  const n = new Date();
  return n.getFullYear() + "-" +
    String(n.getMonth()+1).padStart(2,"0") + "-" +
    String(n.getDate()).padStart(2,"0");
}

// ===== OVERVIEW =====
async function loadOverview(){
  const today = todayISO();

  const {data, error} = await db
    .from("battery_swaps")
    .select("*")
    .eq("date_in", today)
    .order("id", {ascending:false});

  if(error){ console.error(error); return; }

  todayData = data || [];

  let IN=0, OUT=0, stay=0;
  todayData.forEach(r => {
    IN++;
    if(r.time_out) OUT++; else stay++;
  });

  document.getElementById("kIn").innerText   = IN;
  document.getElementById("kOut").innerText  = OUT;
  document.getElementById("kStay").innerText = stay;
  document.getElementById("kSwap").innerText = OUT;
  document.getElementById("kRev").innerText  = "₭" + (OUT * PRICE).toLocaleString();

  renderVehicleTable(todayData);
  renderAlerts(todayData);
  renderFreq(todayData);
}

// ===== VEHICLE TABLE =====
function renderVehicleTable(data){
  const el = document.getElementById("vehicleTable");

  if(!data || data.length === 0){
    el.innerHTML = `<div class="ok-msg">No swaps recorded today</div>`;
    return;
  }

  // 👉 Convert email → name
  function getName(email){
    if(!email) return "-";
    return email.split("@")[0]; // somphone@gmail.com → somphone
  }

  let html = `<table>
    <thead>
      <tr>
        <th>Vehicle</th>
        <th>Battery</th>
        <th>Model</th>
        <th>Mileage IN</th>
        <th>Distance</th>
        <th>Status</th>
        <th>Staff</th>
      </tr>
    </thead>
    <tbody>`;

  data.forEach(r => {
    let dist = "-";
    let rowFlag = false;

    if(r.mileage_in != null && r.mileage_out != null){
      const diff = parseInt(r.mileage_out) - parseInt(r.mileage_in);
      dist = diff + " km";
      if(diff < 50) rowFlag = true;
    }

    html += `<tr style="${rowFlag ? "background:var(--red-dim)" : ""}">
      <td>${r.vehicle_in || "-"}</td>
      <td>${code(r.battery_id)}</td>
      <td>${r.model || "-"}</td>
      <td>${r.mileage_in != null ? r.mileage_in + " km" : "-"}</td>
      <td>${rowFlag ? `<span class="badge badge-alert">${dist}</span>` : dist}</td>
      <td>
        <span class="badge ${r.time_out ? "badge-out" : "badge-in"}">
          ${r.time_out ? "OUT" : "IN"}
        </span>
      </td>
      <td title="${r.user_email || ""}">
        ${getName(r.user_email)}
      </td>
    </tr>`;
  });

  html += "</tbody></table>";
  el.innerHTML = html;
}

// ===== ALERTS =====
function renderAlerts(data){
  const el = document.getElementById("alerts");
  const items = [];

  data.forEach(r => {
    if(r.mileage_in != null && r.mileage_out != null){
      const diff = parseInt(r.mileage_out) - parseInt(r.mileage_in);
      if(diff < 50){
        items.push(`<div class="alert-item">
          <div class="al-id">${code(r.battery_id)}</div>
          <div class="al-detail">${r.vehicle_in || "?"} · only ${diff} km</div>
        </div>`);
      }
    }
  });

  el.innerHTML = items.length ? items.join("") :
    `<div class="ok-msg">✅ No alerts today</div>`;
}

// ===== FREQUENT =====
function renderFreq(data){
  const el = document.getElementById("freq");
  const map = {};

  data.forEach(r => {
    if(!r.vehicle_in) return;
    if(!map[r.vehicle_in]) map[r.vehicle_in] = [];
    map[r.vehicle_in].push(r);
  });

  const entries = Object.entries(map).filter(([,arr]) => arr.length >= 2);

  if(!entries.length){
    el.innerHTML = `<div class="ok-msg">No repeat swaps</div>`;
    return;
  }

  el.innerHTML = entries.map(([v, arr]) =>
    `<div class="freq-item">
      <div class="freq-vehicle">${v} <span style="color:var(--text-dim);font-weight:400">(${arr.length}×)</span></div>
      <div class="freq-detail">${arr.map(x => code(x.battery_id) + " @ " + x.time_in).join("<br>")}</div>
    </div>`
  ).join("");
}

// ===== TRANSACTIONS =====
async function loadTransactions(){
  const from = document.getElementById("filterFrom").value;
  const to   = document.getElementById("filterTo").value;

  let q = db.from("battery_swaps").select("*");
  if(from) q = q.gte("date_in", from);
  if(to)   q = q.lte("date_in", to);

  const {data, error} = await q.order("id", {ascending:false}).limit(500);

  if(error){ console.error(error); return; }

  txData = data || [];

  renderTxTable();
}

// FIX: Separate render so client-side filters don't re-fetch
function renderTxTable(){
  const sb = document.getElementById("filterBattery").value.toUpperCase();
  const sv = document.getElementById("filterVehicle").value.toUpperCase();

  const filtered = txData.filter(r => {
    const c = code(r.battery_id).toUpperCase();
    const v = (r.vehicle_in || "").toUpperCase();
    return (!sb || c.includes(sb)) && (!sv || v.includes(sv));
  });

  const el = document.getElementById("txTable");

  if(!filtered.length){
    el.innerHTML = `<div class="ok-msg">No records found</div>`;
    return;
  }

  let html = `<table>
    <thead><tr>
      <th>Battery</th><th>Vehicle</th><th>Model</th>
      <th>Mileage IN</th><th>Date IN</th><th>Time IN</th>
      <th>Date OUT</th><th>Status</th>
    </tr></thead><tbody>`;

  filtered.forEach(r => {
    html += `<tr>
      <td>${code(r.battery_id)}</td>
      <td>${r.vehicle_in || "-"}</td>
      <td>${r.model || "-"}</td>
      <td>${r.mileage_in != null ? r.mileage_in + " km" : "-"}</td>
      <td>${r.date_in || "-"}</td>
      <td>${r.time_in || "-"}</td>
      <td>${r.date_out || "-"}</td>
      <td><span class="badge ${r.time_out ? "badge-out" : "badge-in"}">${r.time_out ? "OUT" : "IN"}</span></td>
    </tr>`;
  });

  html += "</tbody></table>";
  el.innerHTML = html;
}

// ===== ANALYTICS =====
async function loadAnalytics(){
  const {data, error} = await db
    .from("battery_swaps")
    .select("*")
    .order("date_in", {ascending:false});

  if(error){ console.error(error); return; }

  allData = data || [];

  // === Financial
  let totalSwaps = 0, totalRev = 0;
  const modelMap = {};
  const dateMap  = {};

  allData.forEach(r => {
    if(r.time_out){
      totalSwaps++;
      totalRev += PRICE;

      const m = r.model || "Unknown";
      modelMap[m] = (modelMap[m] || 0) + 1;

      dateMap[r.date_in] = (dateMap[r.date_in] || 0) + 1;
    }
  });

  const todaySwaps = (dateMap[todayISO()] || 0);

  let finHtml = "";
  Object.entries(modelMap).sort((a,b) => b[1]-a[1]).forEach(([m, c]) => {
    finHtml += `<div class="finance-row">
      <span class="f-label">${m}</span>
      <span class="f-value" style="color:var(--text-mid)">${c} swaps · ₭${(c*PRICE).toLocaleString()}</span>
    </div>`;
  });

  finHtml += `<div class="finance-row">
    <span class="f-label">Today's Revenue</span>
    <span class="f-value" style="color:var(--blue)">₭${(todaySwaps*PRICE).toLocaleString()}</span>
  </div>`;

  finHtml += `<div class="finance-row total">
    <span class="f-label">TOTAL REVENUE (All Time)</span>
    <span class="f-value">₭${totalRev.toLocaleString()}</span>
  </div>`;

  document.getElementById("financeTable").innerHTML = finHtml;

  // === Chart — last 7 days
  const last7 = Object.entries(dateMap)
    .sort((a,b) => a[0].localeCompare(b[0]))
    .slice(-7);

  const maxVal = Math.max(...last7.map(([,c]) => c), 1);
  let chartHtml = "";

  last7.forEach(([d, c]) => {
    const pct = Math.round((c / maxVal) * 100);
    chartHtml += `<div class="chart-row">
      <div class="chart-label">${d.slice(5)}</div>
      <div class="chart-bar-wrap">
        <div class="chart-bar" style="width:${Math.max(pct,8)}%">${c}</div>
      </div>
    </div>`;
  });

  document.getElementById("chart").innerHTML = chartHtml || `<div class="ok-msg">No data</div>`;
}

// ===== EXPORT =====
// FIX: export always uses the correct cached dataset per tab
function exportCSV(){
  const source = txData.length ? txData : allData;

  let csv = "Battery,Vehicle,Model,MileageIN,MileageOUT,Distance,DateIN,TimeIN,DateOUT,TimeOUT,Status\n";

  source.forEach(r => {
    const dist = (r.mileage_in != null && r.mileage_out != null)
      ? (parseInt(r.mileage_out) - parseInt(r.mileage_in)) + "km"
      : "";
    csv += [
      code(r.battery_id), r.vehicle_in||"", r.model||"",
      r.mileage_in||"", r.mileage_out||"",
      dist, r.date_in||"", r.time_in||"",
      r.date_out||"", r.time_out||"",
      r.time_out ? "OUT" : "IN"
    ].join(",") + "\n";
  });

  csv += "\n=== ALERTS (<50km distance) ===\nBattery,Vehicle,Distance\n";
  source.forEach(r => {
    if(r.mileage_in != null && r.mileage_out != null){
      const diff = parseInt(r.mileage_out) - parseInt(r.mileage_in);
      if(diff < 50) csv += `${code(r.battery_id)},${r.vehicle_in},${diff}km\n`;
    }
  });

  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "LSM_Report_" + todayISO() + ".csv";
  a.click();
}

// ===== RELOAD ALL =====
async function reloadAll(){
  await Promise.all([loadOverview(), loadTransactions(), loadAnalytics()]);
}

// ===== FILTER EVENTS =====
["filterFrom","filterTo"].forEach(id => {
  document.getElementById(id).addEventListener("change", loadTransactions);
});
["filterBattery","filterVehicle"].forEach(id => {
  document.getElementById(id).addEventListener("input", renderTxTable);
});

// ===== INIT =====
reloadAll();

// ===== REALTIME =====
// FIX: only reload the relevant data view, and debounce to avoid rapid re-fires
let rtTimer = null;
db.channel("rt")
  .on("postgres_changes", {event:"*", schema:"public", table:"battery_swaps"}, () => {
    clearTimeout(rtTimer);
    rtTimer = setTimeout(() => reloadAll(), 800); // debounce 800ms
  })
  .subscribe();
</script>
