<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LSM Battery Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:sans-serif;background:#f4f6f8;margin:0}
.container{max-width:1200px;margin:auto;padding:20px}

.header{text-align:center}
.lsm{color:#ff4500;font-weight:bold}

.nav{display:flex;gap:10px;margin:20px 0}
.nav button{flex:1;padding:12px;border:none;border-radius:8px;background:#ddd;font-weight:bold}
.nav button.active{background:#3498db;color:#fff}

.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}

.row{display:flex;gap:10px;flex-wrap:wrap}

/* KPI */
.stat{
  flex:1;
  padding:15px;
  border-radius:10px;
  color:#fff;
  text-align:center;
  font-weight:bold
}
.in{background:#27ae60}
.out{background:#e67e22}
.stay{background:#8e44ad}
.swap{background:#3498db}
.rev{background:#2c3e50}

/* Layout split */
.split{
  display:flex;
  gap:10px;
}
.left{flex:2}
.right{flex:1}

/* Table */
.table{width:100%;border-collapse:collapse}
.table th,.table td{
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:center;
}

/* Inputs */
.filter-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.left-inputs{
  display:flex;
  gap:5px;
}
.left-inputs input{
  width:130px;
  padding:8px;
}
.search{
  width:200px;
  padding:8px;
}

button{padding:8px 12px;margin-top:5px}

</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">
<h1><span class="lsm">LSM</span> Battery Swaps Dashboard</h1>
<div>Powered by somphone.dang@gmail.com</div>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="tab('overview')" class="active" id="t1">Overview</button>
<button onclick="tab('transactions')" id="t2">Transactions</button>
<button onclick="tab('analytics')" id="t3">Analytics</button>
</div>

<!-- OVERVIEW -->
<div id="overview">

<!-- KPI -->
<div class="card">
<div class="row">
<div class="stat in" id="in"></div>
<div class="stat out" id="out"></div>
<div class="stat stay" id="stay"></div>
<div class="stat swap" id="swap"></div>
<div class="stat rev" id="revenue"></div>
</div>
</div>

<!-- SPLIT -->
<div class="split">

<!-- LEFT -->
<div class="card left">
<h3>🚗 Vehicle Activity (Today)</h3>
<div id="vehicleTable"></div>
</div>

<!-- RIGHT -->
<div class="card right">
<h3>⚠️ Battery Alerts (Low Mileage)</h3>
<div id="alerts"></div>
</div>

</div>

</div>

<!-- TRANSACTIONS -->
<div id="transactions" style="display:none">

<div class="card">

<div class="filter-row">
  <div class="left-inputs">
    <input type="date" id="from">
    <input type="date" id="to">
  </div>

  <input id="search" class="search" placeholder="Search Battery">
</div>

<button onclick="loadTransactions()">Load</button>
<button onclick="exportCSV()">Export</button>

</div>

<div class="card" id="table"></div>
<div class="card" id="modelSummary"></div>

</div>

<!-- ANALYTICS -->
<div id="analytics" style="display:none">

<div class="card">
<h3>🔋 Current Inventory (IN Shop)</h3>
<div id="inventory"></div>
</div>

</div>

</div>

<script>
const db = supabase.createClient(
"https://bdcwfgutqnfhacanswlk.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkY3dmZ3V0cW5maGFjYW5zd2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTg0NzMsImV4cCI6MjA5MDI3NDQ3M30.qHTe6H5ca5PQ9RahiIdrGc4eOMMJrZrSsACAl5mJm4A"
);

const PRICE = 15000;

// TAB
function tab(t){
  ["overview","transactions","analytics"].forEach(x=>{
    document.getElementById(x).style.display="none";
  });
  document.getElementById(t).style.display="block";

  ["t1","t2","t3"].forEach(x=>{
    document.getElementById(x).classList.remove("active");
  });
  event.target.classList.add("active");
}

// UTIL
function code(x){
  try{return JSON.parse(x).code}catch{return x}
}

// OVERVIEW
async function loadOverview(){

  const today = new Date().toISOString().split("T")[0];

  const {data} = await db
    .from("battery_swaps")
    .select("*")
    .eq("date_in", today);

  let IN=0, OUT=0, stay=0;

  data.forEach(r=>{
    IN++;
    if(r.time_out) OUT++;
    else stay++;
  });

  document.getElementById("in").innerText="IN: "+IN;
  document.getElementById("out").innerText="OUT: "+OUT;
  document.getElementById("stay").innerText="Stay: "+stay;
  document.getElementById("swap").innerText="Swaps: "+OUT;
  document.getElementById("revenue").innerText="Revenue: "+(OUT*PRICE)+" LAK";

  renderVehicleTable(data);
  checkAlert(data);
}

// VEHICLE TABLE (UPDATED)
function renderVehicleTable(data){

  let html=`
  <table class="table">
  <tr>
  <th>Vehicle</th>
  <th>Battery</th>
  <th>Model</th>
  <th>Mileage</th>
  <th>Status</th>
  </tr>`;

  data.forEach(r=>{
    html+=`
    <tr>
    <td>${r.vehicle_in||"-"}</td>
    <td>${code(r.battery_id)}</td>
    <td>${r.model||"-"}</td>
    <td>${r.mileage_in||"-"}</td>
    <td>${r.time_out?"OUT":"IN"}</td>
    </tr>`;
  });

  html+="</table>";
  document.getElementById("vehicleTable").innerHTML=html;
}

// ALERT
function checkAlert(data){

  let alerts=[];

  data.forEach(r=>{
    if(r.mileage_in && r.mileage_out){
      let diff=r.mileage_out-r.mileage_in;
      if(diff<50){
        alerts.push(`${code(r.battery_id)} → ${diff}km`);
      }
    }
  });

  const el=document.getElementById("alerts");

  if(alerts.length===0){
    el.innerHTML="✅ Normal";
    el.style.color="green";
  }else{
    el.innerHTML=alerts.join("<br>");
    el.style.color="red";
  }
}

// TRANSACTIONS
async function loadTransactions(){

  let q=db.from("battery_swaps").select("*");

  const from=document.getElementById("from").value;
  const to=document.getElementById("to").value;
  const s=document.getElementById("search").value.toUpperCase();

  if(from) q=q.gte("date_in",from);
  if(to) q=q.lte("date_in",to);

  const {data}=await q.order("id",{ascending:false}).limit(300);

  let html=`
  <table class="table">
  <tr>
  <th>Battery</th>
  <th>Model</th>
  <th>Vehicle</th>
  <th>Mileage</th>
  <th>Date</th>
  <th>Time</th>
  <th>Status</th>
  </tr>`;

  data.forEach(r=>{
    const c=code(r.battery_id);
    if(s && !c.includes(s)) return;

    html+=`
    <tr>
    <td>${c}</td>
    <td>${r.model||"-"}</td>
    <td>${r.vehicle_in||"-"}</td>
    <td>${r.mileage_in||"-"}</td>
    <td>${r.date_in||"-"}</td>
    <td>${r.time_in||"-"}</td>
    <td>${r.time_out?"OUT":"IN"}</td>
    </tr>`;
  });

  html+="</table>";

  document.getElementById("table").innerHTML=html;

  modelSummary(data);
}

// MODEL SUMMARY
function modelSummary(data){

  let map={};

  data.forEach(r=>{
    const m=r.model||"Unknown";
    map[m]=(map[m]||0)+1;
  });

  let html="<h3>Model Summary</h3>";

  Object.entries(map).forEach(([m,c])=>{
    html+=`<div>${m}: ${c}</div>`;
  });

  document.getElementById("modelSummary").innerHTML=html;
}

// EXPORT
async function exportCSV(){
  const {data}=await db.from("battery_swaps").select("*");

  let csv="Battery,Model,Vehicle,Status\n";

  data.forEach(r=>{
    csv+=`${code(r.battery_id)},${r.model},${r.vehicle_in},${r.time_out?"OUT":"IN"}\n`;
  });

  const blob=new Blob([csv]);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="data.csv";
  a.click();
}

// INVENTORY
async function loadInventory(){
  const {data}=await db.from("battery_swaps").select("*");

  let active=data.filter(r=>r.time_out===null);

  let html=`<table class="table">
  <tr><th>Battery</th><th>Model</th><th>Vehicle</th><th>Time</th></tr>`;

  active.forEach(r=>{
    html+=`
    <tr>
    <td>${code(r.battery_id)}</td>
    <td>${r.model}</td>
    <td>${r.vehicle_in}</td>
    <td>${r.time_in}</td>
    </tr>`;
  });

  html+="</table>";

  document.getElementById("inventory").innerHTML=html;
}

// INIT
loadOverview();
loadTransactions();
loadInventory();

setInterval(loadOverview,5000);

</script>

</body>
</html>
