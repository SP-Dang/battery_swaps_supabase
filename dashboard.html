<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8">
  <title>LSM Live Dashboard</title>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: white; padding: 20px; text-align: center; }
    .stat-card { background: #2c3e50; padding: 20px; border-radius: 12px; display: inline-block; margin: 10px; min-width: 200px; border: 2px solid #FF4500; }
    .stat-number { font-size: 48px; font-weight: bold; color: #FF4500; }
    #live-feed { max-width: 600px; margin: 20px auto; background: #333; border-radius: 8px; padding: 15px; text-align: left; border: 1px solid #444; }
    .feed-item { border-bottom: 1px solid #444; padding: 12px; animation: highlight 2s ease-out; font-size: 14px; }
    .feed-item b { color: #FF4500; }
    @keyframes highlight { from { background: #FF450033; } to { background: transparent; } }
    h1 { margin-bottom: 5px; }
  </style>
</head>
<body>

  <h1>LSM Live Command Center</h1>
  <div style="font-style: italic; color: #888; margin-bottom: 20px;">Powered by Somphone</div>

  <div class="stat-card">
    <div style="font-size: 12px; letter-spacing: 1px;">TOTAL SWAPS TODAY</div>
    <div id="today-count" class="stat-number">0</div>
  </div>

  <h2>Recent Activity</h2>
  <div id="live-feed">
    <div id="placeholder" style="color: #888; text-align: center;">Waiting for scans...</div>
  </div>

  <script>
    // 1. Initialize Supabase
    const supabaseUrl = 'https://bdcwfgutqnfhacanswlk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkY3dmZ3V0cW5maGFjYW5zd2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTg0NzMsImV4cCI6MjA5MDI3NDQ3M30.qHTe6H5ca5PQ9RahiIdrGc4eOMMJrZrSsACAl5mJm4A';
    
    // Using _supabase to avoid naming conflicts
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // 2. The Live Listener (Connects to the "Shouting" database)
    const channel = _supabase
      .channel('schema-db-changes')
      .on(
        'postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'battery_swaps' },
        (payload) => {
          console.log('New Swap Detected!', payload.new);
          updateDashboard(payload.new);
        }
      )
      .subscribe();

    // 3. Update the UI
    function updateDashboard(data) {
      const feed = document.getElementById('live-feed');
      const placeholder = document.getElementById('placeholder');
      
      // Remove the "Waiting" text on the first scan
      if (placeholder) placeholder.remove();
      
      // Create a new feed item
      const item = document.createElement('div');
      item.className = 'feed-item';
      
      // Use logical defaults if data is missing
      const time = data.time_in || "Just now";
      const bid = data.battery_id || "Unknown";
      const model = data.model || "Standard";
      const vno = data.vehicle_in || "N/A";

      item.innerHTML = `
        <strong>${time}</strong>: Battery <b>${bid}</b> (${model}) Logged IN for Vehicle <b>${vno}</b>
      `;
      
      // Add to top of list
      feed.prepend(item);

      // Increment the counter
      const counter = document.getElementById('today-count');
      counter.innerText = parseInt(counter.innerText) + 1;
    }
  </script>
</body>
</html>
