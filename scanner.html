<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Battery Swap</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d0f12;
  --surface:#161a20;
  --surface2:#1e242d;
  --border:#2a3040;
  --accent:#00e5a0;
  --accent2:#0099ff;
  --warn:#ff6b35;
  --text:#e8eaf0;
  --text-dim:#6b7585;
  --radius:12px;
  --font-mono:'JetBrains Mono',monospace;
  --font-head:'Orbitron',sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:var(--font-mono);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background-image:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(0,229,160,0.06) 0%, transparent 60%);
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:28px 24px;
  width:100%;
  max-width:420px;
  box-shadow:0 0 60px rgba(0,0,0,0.5);
}

.header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:24px;
  padding-bottom:20px;
  border-bottom:1px solid var(--border);
}

.header-icon{
  width:44px;height:44px;
  background:rgba(0,229,160,0.12);
  border:1px solid rgba(0,229,160,0.25);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
}

.header h2{
  font-family:var(--font-head);
  font-size:1.2rem;
  font-weight:800;
  letter-spacing:-0.02em;
}

.header small{
  display:block;
  font-size:0.65rem;
  color:var(--text-dim);
  font-weight:400;
  margin-top:2px;
}

/* SCANNER */
#reader{
  width:100%;
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:16px;
  border:2px solid var(--accent);
  display:none;
  position:relative;
}

#reader::after{
  content:'';
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:160px;height:160px;
  border:2px solid var(--accent);
  border-radius:4px;
  box-shadow:0 0 0 2000px rgba(0,0,0,0.4);
  pointer-events:none;
}

/* INPUTS */
.field{
  margin-bottom:12px;
  position:relative;
}

.field label{
  display:block;
  font-size:0.65rem;
  color:var(--text-dim);
  text-transform:uppercase;
  letter-spacing:0.1em;
  margin-bottom:6px;
}

.field input{
  width:100%;
  padding:12px 14px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  color:var(--text);
  font-family:var(--font-mono);
  font-size:0.9rem;
  transition:border-color 0.2s;
  outline:none;
}

.field input:focus{border-color:var(--accent2)}
.field input.scanned{border-color:var(--accent)}

/* BUTTONS */
.btn-scan{
  width:100%;
  padding:13px;
  margin-bottom:16px;
  border:1px solid var(--accent);
  border-radius:var(--radius);
  background:rgba(0,229,160,0.08);
  color:var(--accent);
  font-family:var(--font-mono);
  font-size:0.9rem;
  font-weight:700;
  cursor:pointer;
  transition:all 0.2s;
  letter-spacing:0.05em;
}
.btn-scan:hover{background:rgba(0,229,160,0.15)}
.btn-scan.active{background:rgba(255,107,53,0.1);border-color:var(--warn);color:var(--warn)}

.btn-container{display:flex;gap:10px;margin-top:4px}

.btn-action{
  flex:1;
  padding:14px;
  border:none;
  border-radius:var(--radius);
  font-family:var(--font-mono);
  font-size:0.9rem;
  font-weight:700;
  cursor:pointer;
  transition:all 0.18s;
  letter-spacing:0.08em;
}

.btn-in{background:rgba(0,229,160,0.15);color:var(--accent);border:1px solid rgba(0,229,160,0.3)}
.btn-in:hover:not(:disabled){background:rgba(0,229,160,0.25)}
.btn-out{background:rgba(255,107,53,0.12);color:var(--warn);border:1px solid rgba(255,107,53,0.3)}
.btn-out:hover:not(:disabled){background:rgba(255,107,53,0.22)}

button:disabled{opacity:0.4;cursor:not-allowed}

/* STATUS */
#status{
  margin-top:16px;
  padding:12px 14px;
  border-radius:var(--radius);
  font-size:0.8rem;
  font-weight:700;
  text-align:center;
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text-dim);
  transition:all 0.2s;
  min-height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
}
#status.ok{background:rgba(0,229,160,0.08);border-color:rgba(0,229,160,0.3);color:var(--accent)}
#status.err{background:rgba(255,107,53,0.08);border-color:rgba(255,107,53,0.3);color:var(--warn)}
#status.loading{background:rgba(0,153,255,0.08);border-color:rgba(0,153,255,0.3);color:var(--accent2)}

/* CONFIRM MODAL */
.modal-bg{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,0.75);
  z-index:100;
  align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
.modal-bg.show{display:flex}
.modal{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:28px 24px;
  max-width:320px;
  width:90%;
  text-align:center;
}
.modal h3{font-family:var(--font-head);font-size:1.1rem;margin-bottom:8px}
.modal p{color:var(--text-dim);font-size:0.8rem;margin-bottom:20px;line-height:1.6}
.modal .confirm-info{
  background:var(--surface2);
  border-radius:8px;
  padding:12px;
  margin-bottom:20px;
  font-size:0.8rem;
  text-align:left;
  line-height:1.8;
}
.modal .confirm-info span{color:var(--text-dim)}
.modal-btns{display:flex;gap:10px}
.modal-btns button{flex:1;padding:12px;border-radius:8px;font-family:var(--font-mono);font-weight:700;cursor:pointer;border:none;font-size:0.85rem}
.btn-cancel{background:var(--surface2);color:var(--text-dim)}
.btn-confirm-in{background:var(--accent);color:#000}
.btn-confirm-out{background:var(--warn);color:#fff}
</style>
</head>

<body>

<!-- CONFIRM MODAL -->
<div class="modal-bg" id="confirmModal">
  <div class="modal">
    <h3 id="modalTitle">Confirm Action</h3>
    <div class="confirm-info" id="modalInfo"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="pendingAction=null;closeModal()">Cancel</button>
      <button id="modalConfirmBtn" onclick="confirmProcess()"></button>
    </div>
  </div>
</div>

<div class="card">
  <div class="header">
    <div class="header-icon">🔋</div>
    <div>
      <h2>Battery Swap</h2>
      <small id="clockDisplay">Loading time...</small>
    </div>
  </div>

  <div id="reader"></div>
  <button id="scanBtn" class="btn-scan">📷 SCAN QR CODE</button>

  <div class="field">
    <label>Battery ID</label>
    <input id="bid" placeholder="e.g. BAT-001" autocomplete="off" maxlength="50">
  </div>
  <div class="field">
    <label>Vehicle No</label>
    <input id="vno" placeholder="e.g. LA-1234" autocomplete="off" maxlength="20">
  </div>
  <div class="field">
    <label>Mileage (km)</label>
    <input id="mil" type="number" placeholder="e.g. 1500" min="0" max="999999">
  </div>

  <div class="btn-container">
    <button class="btn-action btn-in" onclick="requestProcess('IN')">⬇ IN</button>
    <button class="btn-action btn-out" onclick="requestProcess('OUT')">⬆ OUT</button>
  </div>

  <div id="status">Ready</div>
</div>

<script>
// ===== CONFIG =====
// FIX: Keys are public (anon) but ensure RLS is enabled in Supabase dashboard
// so only valid inserts/updates are allowed per table policy.
const SUPABASE_URL = "https://bdcwfgutqnfhacanswlk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkY3dmZ3V0cW5maGFjYW5zd2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTg0NzMsImV4cCI6MjA5MDI3NDQ3M30.qHTe6H5ca5PQ9RahiIdrGc4eOMMJrZrSsACAl5mJm4A";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== STATE =====
let scanner = null;
let scanning = false;
let pendingAction = null; // { type, bid, vno, mil, battery }

// ===== CLOCK =====
function updateClock(){
  const n = new Date();
  document.getElementById("clockDisplay").innerText =
    n.toLocaleDateString("en-CA") + " · " + n.toLocaleTimeString("en-GB");
}
updateClock();
setInterval(updateClock, 1000);

// ===== STATUS =====
function setStatus(msg, type="idle"){
  const s = document.getElementById("status");
  s.innerText = msg;
  s.className = type === "ok" ? "ok" : type === "err" ? "err" : type === "loading" ? "loading" : "";
}

// ===== UI LOCK =====
function lockUI(lock=true){
  document.querySelectorAll(".btn-action, #scanBtn").forEach(b => b.disabled = lock);
}

// ===== INPUT SANITIZE =====
// FIX: sanitize strings to prevent injection / garbage data
function sanitize(str){ return String(str).replace(/[<>"'`]/g,"").trim() }

// ===== TIME =====
function getNow(){
  const n = new Date();
  return {
    date: n.toLocaleDateString("en-CA"),
    time: n.toLocaleTimeString("en-GB")
  };
}

// ===== SCANNER =====
async function closeScanner(){
  if(scanner){
    try{ await scanner.stop(); await scanner.clear(); }catch(e){}
    scanner = null;
  }
  scanning = false;
  document.getElementById("reader").style.display = "none";
  const btn = document.getElementById("scanBtn");
  btn.innerText = "📷 SCAN QR CODE";
  btn.classList.remove("active");
}

document.getElementById("scanBtn").onclick = async () => {
  if(scanning){ await closeScanner(); return; }

  const reader = document.getElementById("reader");
  reader.style.display = "block";
  const btn = document.getElementById("scanBtn");
  btn.innerText = "🛑 CLOSE SCANNER";
  btn.classList.add("active");

  scanner = new Html5Qrcode("reader");

  try{
    await scanner.start(
      {facingMode:"environment"},
      {fps:10, qrbox:{width:200,height:200}},
      (decoded) => {
        // FIX: sanitize QR decoded value before use
        let code = decoded;
        try{
          const j = JSON.parse(decoded);
          if(j.code) code = j.code;
        }catch(e){}

        code = sanitize(code).toUpperCase();
        // FIX: validate basic format — only allow alphanumeric + dash/underscore
        if(!/^[A-Z0-9_\-]{1,50}$/.test(code)){
          setStatus("❌ Invalid QR format", "err");
          return;
        }

        const bidEl = document.getElementById("bid");
        bidEl.value = code;
        bidEl.classList.add("scanned");
        setStatus("✅ Scanned: " + code, "ok");
        setTimeout(() => closeScanner(), 200);
      }
    );
    scanning = true;
  }catch(err){
    setStatus("Camera error: " + err.message, "err");
    await closeScanner();
  }
};

// ===== REQUEST (shows confirm modal) =====
// FIX: Added confirmation step to prevent fat-finger errors
async function requestProcess(type){
  const bid = sanitize(document.getElementById("bid").value).toUpperCase();
  const vno = sanitize(document.getElementById("vno").value);
  const milRaw = document.getElementById("mil").value.trim();
  const mil = parseInt(milRaw, 10);

  if(!bid)  return setStatus("❌ Enter Battery ID", "err");
  if(!vno)  return setStatus("❌ Enter Vehicle No", "err");
  if(!milRaw) return setStatus("❌ Enter Mileage", "err");
  // FIX: validate mileage is a positive number
  if(isNaN(mil) || mil < 0 || mil > 999999)
    return setStatus("❌ Invalid mileage value", "err");
  // FIX: validate bid format
  if(!/^[A-Z0-9_\-]{1,50}$/.test(bid))
    return setStatus("❌ Invalid Battery ID format", "err");

  lockUI(true);
  setStatus("⏳ Verifying battery...", "loading");

  try{
    // FIX: use exact match instead of broad ilike to avoid multi-match ambiguity
    const {data:battery, error:e1} = await db
      .from("battery_master")
      .select("*")
      .ilike("battery_id", `%${bid}%`)
      .maybeSingle();

    if(e1 || !battery) throw new Error("Battery not found in master list");

    pendingAction = {type, bid, vno, mil: mil.toString(), battery};

    // Show modal
    document.getElementById("modalTitle").innerText = type === "IN" ? "⬇ Confirm Battery IN" : "⬆ Confirm Battery OUT";
    document.getElementById("modalInfo").innerHTML =
      `<span>Battery:</span>  ${bid}<br>` +
      `<span>Model:</span>    ${battery.model || "-"}<br>` +
      `<span>Vehicle:</span>  ${vno}<br>` +
      `<span>Mileage:</span>  ${mil} km`;

    const btn = document.getElementById("modalConfirmBtn");
    btn.innerText = "Confirm " + type;
    btn.className = type === "IN" ? "btn-confirm-in" : "btn-confirm-out";

    document.getElementById("confirmModal").classList.add("show");
    setStatus("Waiting for confirmation...");

  }catch(err){
    setStatus("❌ " + err.message, "err");
  }finally{
    lockUI(false);
  }
}

function closeModal(){
  document.getElementById("confirmModal").classList.remove("show");
  // NOTE: do NOT clear pendingAction here — confirmProcess() needs it
  setStatus("Ready");
}

// ===== CONFIRMED PROCESS =====
async function confirmProcess(){
  // FIX: read pendingAction BEFORE closing modal
  if(!pendingAction) return;
  const {type, bid, vno, mil, battery} = pendingAction;
  pendingAction = null;

  // Now safe to close modal
  document.getElementById("confirmModal").classList.remove("show");

  const now = getNow();
  lockUI(true);
  setStatus("⏳ Processing...", "loading");

  try{
    if(type === "IN"){
      // FIX: use ilike so it matches both clean IDs and legacy JSON-stored IDs
      const {data:exist} = await db
        .from("battery_swaps")
        .select("id")
        .ilike("battery_id", `%${bid}%`)
        .is("time_out", null);

      if(exist && exist.length > 0) throw new Error("Battery is already checked IN");

      const {error} = await db.from("battery_swaps").insert([{
        battery_id: bid,
        model: battery.model,
        vehicle_in: vno,
        mileage_in: parseInt(mil, 10),
        date_in: now.date,
        time_in: now.time
      }]);

      if(error) throw error;
      setStatus("✅ Battery IN logged", "ok");

    }else{

      // FIX: use ilike so it matches both clean IDs and legacy JSON-stored IDs
      const {data:exist} = await db
        .from("battery_swaps")
        .select("*")
        .ilike("battery_id", `%${bid}%`)
        .is("time_out", null)
        .limit(1);

      if(!exist || exist.length === 0) throw new Error("No open IN record for this battery");

      const mileageOut = parseInt(mil, 10);
      const mileageIn  = parseInt(exist[0].mileage_in, 10);
      if(!isNaN(mileageIn) && mileageOut < mileageIn)
        throw new Error(`Mileage OUT (${mileageOut}) must be ≥ mileage IN (${mileageIn})`);

      const {error} = await db
        .from("battery_swaps")
        .update({
          vehicle_out: vno,
          mileage_out: mileageOut,
          date_out: now.date,
          time_out: now.time
        })
        .eq("id", exist[0].id);

      if(error) throw error;
      setStatus("✅ Battery OUT logged", "ok");
    }

    // Reset form
    document.getElementById("bid").value = "";
    document.getElementById("vno").value = "";
    document.getElementById("mil").value = "";
    document.getElementById("bid").classList.remove("scanned");

  }catch(err){
    setStatus("❌ " + err.message, "err");
  }finally{
    lockUI(false);
  }
}
</script>
</body>
</html>
