<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8">
  <title>LSM Battery Station</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; text-align: center; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
    #reader { width: 100%; min-height: 250px; background: #000; border-radius: 8px; margin-bottom: 10px; display: none; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;}
    button { padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; width: 48%; }
    .btn-scan { background: #3498db; width: 100% !important; }
    .btn-in { background: #27ae60; }
    .btn-out { background: #e67e22; }
    #status { margin-top: 15px; font-weight: bold; min-height: 20px;}
    .btn-container { display: flex; justify-content: space-between; }
  </style>
</head>

<body>
  <div class="card">
    <div style="margin-bottom: 25px;">
      <span style="font-size: 38px; font-weight: 900; color: #FF4500;">L</span>
      <span style="font-size: 38px; font-weight: 900; color: #FF4500; margin-left: -5px;">S</span>
      <span style="font-size: 38px; font-weight: 900; color: #FF4500; margin-left: -5px;">M</span>
      <div style="font-size: 11px; color: #2c3e50; letter-spacing: 2px; margin-top: -5px; font-weight: bold;">
        LAO SMART MOBILITY
      </div>
      <div style="font-size: 10px; color: #7f8c8d; font-style: italic; margin-top: 4px;">
        Powered by Somphone
      </div>
    </div>

    <div id="reader"></div>
    <button id="scanBtn" class="btn-scan" onclick="toggleCamera()">📷 OPEN SCANNER</button>

    <input type="text" id="bid" placeholder="Battery ID">
    <input type="text" id="vno" placeholder="Vehicle No">
    <input type="number" id="mil" placeholder="Mileage">

    <div class="btn-container">
      <button type="button" class="btn-in" onclick="process('IN')">LOG IN</button>
      <button type="button" class="btn-out" onclick="process('OUT')">LOG OUT</button>
    </div>

    <div id="status">Ready</div>
  </div>

  <script>
    // 1. Initialize Supabase
    const supabaseUrl = 'https://bdcwfgutqnfhacanswlk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkY3dmZ3V0cW5maGFjYW5zd2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTg0NzMsImV4cCI6MjA5MDI3NDQ3M30.qHTe6H5ca5PQ9RahiIdrGc4eOMMJrZrSsACAl5mJm4A';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let scanner;
    let isScanning = false;

    function toggleCamera() {
      const readerDiv = document.getElementById('reader');
      const scanBtn = document.getElementById('scanBtn');
      if (!isScanning) {
        readerDiv.style.display = 'block';
        scanBtn.innerText = "🛑 CLOSE SCANNER";
        startScanner();
      } else {
        stopScanner();
        readerDiv.style.display = 'none';
        scanBtn.innerText = "📷 OPEN SCANNER";
      }
      isScanning = !isScanning;
    }

    function startScanner() {
      scanner = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };
      scanner.start({ facingMode: "environment" }, config,
        (text) => {
          document.getElementById('bid').value = text;
          document.getElementById('status').innerText = "✅ Scanned: " + text;
          document.getElementById('status').style.color = "green";
          toggleCamera();
        },
        (err) => {}
      ).catch(err => {
        document.getElementById('status').innerText = "Camera Error: " + err;
        document.getElementById('status').style.color = "red";
      });
    }

    function stopScanner() {
      if (scanner) scanner.stop().catch(e => console.log(e));
    }

    // THE "ENGINE" THAT POWERS THE APP
async function process(type) {
      const status = document.getElementById('status');
      const bid = document.getElementById('bid').value.trim();
      const vno = document.getElementById('vno').value.trim();
      const mil = document.getElementById('mil').value.trim();

      if (!bid) { status.innerText = "❌ Enter Battery ID"; return; }

      status.innerText = "⏳ Authenticating...";
      status.style.color = "orange";

      // 1. MASTER VERIFICATION (Now grabbing the 'model' too)
      const { data: masterData, error: masterErr } = await _supabase
        .from('battery_master') 
        .select('battery_id, model') // <--- ADDED: Fetch 'model' here
        .ilike('battery_id', bid)
        .maybeSingle();

      if (masterErr || !masterData) {
        status.innerText = "❌ REJECTED: Not in Master List!";
        status.style.color = "red";
        return; 
      }

      // Store the model name from the Master List
      const batteryModel = masterData.model; 

      const today = new Date().toISOString().split('T')[0];
      const nowTime = new Date().toLocaleTimeString('en-GB');

      if (type === 'IN') {
        const { data: existing } = await _supabase
          .from('battery_swaps')
          .select('id')
          .eq('battery_id', bid)
          .is('time_out', null);

        if (existing && existing.length > 0) {
          status.innerText = "⚠️ BLOCKED: Already IN!";
          status.style.color = "red";
          return;
        }

        // 2. INSERT (Now including the model)
        const { error } = await _supabase
          .from('battery_swaps')
          .insert([{ 
            battery_id: bid, 
            model: batteryModel, // <--- ADDED: Save model to the log
            vehicle_in: vno, 
            mileage_in: mil, 
            date_in: today, 
            time_in: nowTime 
          }]);

        handleResponse(error, "Logged IN", status);

      } else {
        // ... (LOG OUT logic remains the same, as the model was already saved during IN)
        const { data: records, error: fetchErr } = await _supabase
          .from('battery_swaps')
          .select('id')
          .eq('battery_id', bid)
          .is('time_out', null)
          .order('id', { ascending: false })
          .limit(1);

        if (fetchErr || !records || records.length === 0) {
          status.innerText = "⚠️ BLOCKED: Not IN shop!";
          status.style.color = "red";
          return;
        }

        const { error: updateErr } = await _supabase
          .from('battery_swaps')
          .update({ vehicle_out: vno, mileage_out: mil, date_out: today, time_out: nowTime })
          .eq('id', records[0].id);

        handleResponse(updateErr, "Logged OUT", status);
      }
    }

    function handleResponse(error, action, statusEl) {
      if (error) {
        statusEl.innerText = "❌ DB Error: " + error.message;
        statusEl.style.color = "red";
      } else {
        statusEl.innerText = "✅ " + action + "!";
        statusEl.style.color = "green";
        // Reset fields
        document.getElementById('bid').value = "";
        document.getElementById('vno').value = "";
        document.getElementById('mil').value = "";
      }
    }
  </script>
</body>
</html>
