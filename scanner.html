<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Battery Swap</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{font-family:sans-serif;background:#f0f2f5;text-align:center;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;max-width:400px;margin:auto}
#reader{width:100%;min-height:250px;background:#000;border-radius:8px;margin-bottom:10px;display:none}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:5px}
button{padding:12px;border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;margin-top:10px;width:48%}
.btn-scan{background:#3498db;width:100%!important}
.btn-in{background:#27ae60}
.btn-out{background:#e67e22}
.btn-container{display:flex;justify-content:space-between}
#status{margin-top:15px;font-weight:700}
</style>
</head>

<body>

<div class="card">
<h2>🔋 Battery Swap</h2>

<div id="reader"></div>
<button id="scanBtn" class="btn-scan">📷 SCAN</button>

<input id="bid" placeholder="Battery ID">
<input id="vno" placeholder="Vehicle No">
<input id="mil" type="number" placeholder="Mileage">

<div class="btn-container">
  <button class="btn-in" onclick="process('IN')">IN</button>
  <button class="btn-out" onclick="process('OUT')">OUT</button>
</div>

<div id="status">Ready</div>
</div>

<script>
const db = supabase.createClient(
  "https://bdcwfgutqnfhacanswlk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkY3dmZ3V0cW5maGFjYW5zd2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTg0NzMsImV4cCI6MjA5MDI3NDQ3M30.qHTe6H5ca5PQ9RahiIdrGc4eOMMJrZrSsACAl5mJm4A"
);

let scanner=null, scanning=false, rawData=null;

function setStatus(msg,color="black"){
  const s=document.getElementById("status");
  s.innerText=msg;
  s.style.color=color;
}

function getNow(){
  const n=new Date();
  return {
    date:n.toLocaleDateString("en-CA"),
    time:n.toLocaleTimeString("en-GB")
  };
}

// ===== SCANNER =====
document.getElementById("scanBtn").onclick=async()=>{
  const reader=document.getElementById("reader");

  if(scanning){
    await scanner.stop(); await scanner.clear();
    scanner=null; scanning=false;
    reader.style.display="none";
    return;
  }

  reader.style.display="block";
  scanner=new Html5Qrcode("reader");

  await scanner.start(
    {facingMode:"environment"},
    {fps:10,qrbox:{width:250,height:250}},
    (decoded)=>{
      rawData=decoded;

      let code=decoded;
      try{
        const j=JSON.parse(decoded);
        if(j.code) code=j.code;
      }catch(e){}

      code=code.trim().toUpperCase();

      document.getElementById("bid").value=code;
      setStatus("Scanned: "+code,"green");

      scanner.stop(); scanner.clear();
      scanning=false;
      reader.style.display="none";
    }
  );

  scanning=true;
};

// ===== MAIN =====
async function process(type){

  const bid=document.getElementById("bid").value.trim().toUpperCase();
  const vno=document.getElementById("vno").value.trim();
  const mil=document.getElementById("mil").value.trim();

  if(!bid) return setStatus("Enter Battery ID","red");
  if(!vno) return setStatus("Enter Vehicle","red");
  if(!mil) return setStatus("Enter Mileage","red");

  const raw = rawData || JSON.stringify({code:bid});
  const now=getNow();

  try{

    // ==== CHECK MASTER ====
    const {data:battery,error:e1}=await db
      .from("battery_master")
      .select("*")
      .ilike("battery_id", `%"code":"${bid}"%`)
      .maybeSingle();

    if(e1 || !battery) throw new Error("Battery not found");

    if(type==="IN"){

      const {data:exist}=await db
        .from("battery_swaps")
        .select("id")
        .ilike("battery_id", `%"code":"${bid}"%`)
        .eq("status","IN");

      if(exist && exist.length>0)
        throw new Error("Already IN");

      const {error}=await db.from("battery_swaps").insert([{
        battery_id:raw,
        vehicle_in:vno,
        mileage_in:mil,
        status:"IN",
        date_in:now.date,
        time_in:now.time
      }]);

      if(error) throw error;

      setStatus("Logged IN","green");

    }else{

      const {data:exist}=await db
        .from("battery_swaps")
        .select("*")
        .ilike("battery_id", `%"code":"${bid}"%`)
        .eq("status","IN")
        .limit(1);

      if(!exist || exist.length===0)
        throw new Error("Not IN");

      const {error}=await db
        .from("battery_swaps")
        .update({
          vehicle_out:vno,
          mileage_out:mil,
          status:"OUT",
          date_out:now.date,
          time_out:now.time
        })
        .eq("id",exist[0].id);

      if(error) throw error;

      setStatus("Logged OUT","green");
    }

    document.getElementById("bid").value="";
    document.getElementById("vno").value="";
    document.getElementById("mil").value="";
    rawData=null;

  }catch(err){
    setStatus(err.message,"red");
  }
}
</script>

</body>
</html>
